<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Murali's English Dictionary</title>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        /* CSS Variables for consistent theming */
        :root {
            --bg-primary: #1a1a1a;
            --bg-secondary: #242424;
            --bg-tertiary: #2a2a2a;
            --accent-primary: #c87941;
            --accent-secondary: #d89057;
            --text-primary: #e8e8e8;
            --text-secondary: #b8b8b8;
            --text-muted: #666;
            --border-color: #3d3d3d;
            --success-color: #7bc87f;
            --warning-color: #f39c12;
            --error-color: #d9534f;
        }

        *{margin:0;padding:0;box-sizing:border-box;font-family:'Google Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Oxygen,Ubuntu,Cantarell,"Open Sans","Helvetica Neue",sans-serif}
        body{background:var(--bg-primary);color:var(--text-primary);line-height:1.6;font-family:'Google Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Oxygen,Ubuntu,Cantarell,"Open Sans","Helvetica Neue",sans-serif}
        @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
        @keyframes slideDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
        @keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
        @keyframes shimmer{0%{background-position:-1000px 0}100%{background-position:1000px 0}}
        
        /* Enhanced Grid Layout */
        .main-content {
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
            align-items: start;
        }

        @media (min-width: 1024px) {
            .main-content.full-width {
                grid-template-columns: minmax(0, 1fr);
                max-width: 900px;
                margin: 0 auto;
            }
        }

        /* Enhanced container for better spacing */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        @media (min-width: 768px) {
            .container {
                padding: 60px 40px;
            }
        }
        
        /* Skeleton Loading Styles */
        .skeleton-loading {
            background: var(--bg-secondary);
            border-radius: 8px;
            padding: 30px;
            border: 1px solid var(--border-color);
            animation: pulse 2s ease-in-out infinite;
        }

        .skeleton-line {
            height: 16px;
            background: linear-gradient(90deg, var(--bg-tertiary) 25%, #333 50%, var(--bg-tertiary) 75%);
            background-size: 200% 100%;
            border-radius: 4px;
            margin-bottom: 12px;
            animation: shimmer 1.5s infinite;
        }

        .skeleton-line.short { width: 60%; }
        .skeleton-line.medium { width: 80%; }
        .skeleton-line.long { width: 95%; }
        .skeleton-line.extra-long { width: 100%; height: 24px; margin-bottom: 16px; }

        .skeleton-title {
            height: 28px;
            background: linear-gradient(90deg, var(--bg-tertiary) 25%, #333 50%, var(--bg-tertiary) 75%);
            background-size: 200% 100%;
            border-radius: 6px;
            margin-bottom: 20px;
            width: 40%;
            animation: shimmer 1.5s infinite;
        }

        .skeleton-word {
            height: 32px;
            background: linear-gradient(90deg, var(--bg-tertiary) 25%, #333 50%, var(--bg-tertiary) 75%);
            background-size: 200% 100%;
            border-radius: 6px;
            margin-bottom: 24px;
            width: 50%;
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        .loading-container{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px;gap:24px}
        .loading-spinner{width:48px;height:48px;border:4px solid var(--border-color);border-top:4px solid var(--accent-primary);border-radius:50%;animation:spin 1s linear infinite}
        .loading-text{font-size:18px;color:var(--text-secondary);font-weight:500;animation:pulse 2s ease-in-out infinite}
        .loading-subtext{font-size:14px;color:var(--text-muted);margin-top:-12px}
        .hero-section{background:linear-gradient(135deg,var(--bg-secondary) 0%,#1f1f1f 100%);padding:40px 30px;text-align:center;color:var(--text-primary)}
        .hero-title{font-size:48px;font-weight:700;margin-bottom:20px;text-shadow:0 2px 8px rgba(200,121,65,0.3);background:linear-gradient(135deg, var(--text-primary) 0%, var(--accent-secondary) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-0.02em}
        .hero-subtitle{font-size:20px;margin-bottom:20px;opacity:0.85}
        .search-container{max-width:550px;margin:0 auto;position:relative}
        .search-box{position:relative;background:var(--bg-secondary);border-radius:50px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,0.4);border:1px solid var(--border-color);transition:all 0.3s ease}
        .search-box:focus-within{box-shadow:0 8px 32px rgba(200,121,65,0.4);border-color:var(--accent-primary)}
        .search-box input{width:100%;padding:20px 60px 20px 30px;font-size:18px;border:none;outline:none;background:transparent;color:var(--text-primary)}
        .search-box input::placeholder{color:var(--text-muted)}
        .search-icon{position:absolute;right:25px;top:50%;transform:translateY(-50%);color:var(--text-muted);pointer-events:none;width:24px;height:24px}
        .search-icon svg{width:100%;height:100%;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
        .autocomplete-dropdown{position:absolute;top:calc(100% + 8px);left:0;right:0;background:var(--bg-tertiary);border:1px solid var(--accent-primary);border-radius:16px;box-shadow:0 12px 32px rgba(0,0,0,0.5),0 4px 16px rgba(200,121,65,0.2);max-height:320px;overflow-y:auto;display:none;z-index:1000;-webkit-overflow-scrolling:touch;animation:slideDown 0.25s cubic-bezier(0.16,1,0.3,1);backdrop-filter:blur(10px)}
        .autocomplete-dropdown.show{display:block}
        .autocomplete-item{padding:16px 20px;cursor:pointer;border-bottom:1px solid #3a3a3a;transition:all 0.2s cubic-bezier(0.16,1,0.3,1);position:relative}
        .autocomplete-item:first-child{border-radius:15px 15px 0 0}
        .autocomplete-item:last-child{border-bottom:none;border-radius:0 0 15px 15px}
        .autocomplete-item:hover{background:linear-gradient(135deg,#333 0%,#2d2d2d 100%);border-color:var(--accent-primary);transform:translateY(-2px);box-shadow:0 6px 16px rgba(200,121,65,0.3)}
        .autocomplete-item.selected{background:linear-gradient(135deg,#3a3a3a 0%,#323232 100%);border-color:var(--accent-primary);box-shadow:0 6px 16px rgba(200,121,65,0.4)}
        .autocomplete-word{font-weight:600;color:var(--text-primary);font-size:16px;letter-spacing:-0.01em}
        .autocomplete-dropdown::-webkit-scrollbar{width:6px}
        .autocomplete-dropdown::-webkit-scrollbar-track{background:transparent;border-radius:4px}
        .autocomplete-dropdown::-webkit-scrollbar-thumb{background:var(--accent-primary);border-radius:4px;transition:background 0.3s}
        .autocomplete-dropdown::-webkit-scrollbar-thumb:hover{background:var(--accent-secondary)}
        .words-column{background:var(--bg-secondary);padding:30px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,0.3);border:1px solid var(--border-color)}
        .section-title{font-size:22px;font-weight:600;color:var(--text-primary);margin-bottom:15px;padding-bottom:10px;border-bottom:2px solid var(--accent-primary);opacity:0.85;text-shadow:0 1px 2px rgba(0,0,0,0.3)}
        .word-entry{padding:15px 0;border-bottom:1px solid var(--border-color)}
        .word-entry:first-child{padding-top:0}
        .word-entry:last-child{border-bottom:none;padding-bottom:0}
        .word-title{font-size:26px;font-weight:700;color:var(--text-primary);margin-bottom:12px}
        .word-definition{font-size:16px;color:#d8d8d8;line-height:1.6;margin-bottom:15px;white-space:normal;word-wrap:break-word;font-weight:500;word-spacing:-0.05em}
        .word-definition p{margin:0.75em 0}
        .word-definition ul,.word-definition ol{margin:0.5em 0;padding-left:1.2em}
        .word-definition li{margin:0.25em 0;line-height:1.45}
        .word-definition h1{font-size:25px;margin:1em 0 0.15em 0;line-height:1.3;color:#efefef}
        .word-definition h2{font-size:22px;margin:1em 0 0.15em 0;line-height:1.3;color:#efefef}
        .word-definition h3{font-size:20px;margin:1em 0 0.15em 0;line-height:1.3;color:#efefef}
        .word-definition h4{font-size:18px;margin:1em 0 0.15em 0;line-height:1.3;color:#efefef}
        .word-definition h5{font-size:16px;margin:1em 0 0.4em 0;line-height:1.3;color:#efefef}
        .word-definition h6{font-size:14px;margin:1em 0 0.4em 0;line-height:1.3;color:#efefef}
        .word-definition strong,.word-definition b{color:#efefef}
        .btn-show-word{background:var(--bg-secondary);color:var(--text-primary);border:1px solid var(--border-color);border-radius:50px;padding:12px 24px;font-size:15px;font-weight:600;cursor:pointer;transition:all 0.3s ease;box-shadow:0 6px 20px rgba(200,121,65,0.4);border-color:var(--accent-primary);width:auto;display:block;margin:20px auto 0 auto}
        .btn-show-word:hover{box-shadow:0 8px 24px rgba(200,121,65,0.5);transform:translateY(-2px)}
        .no-words{text-align:center;padding:60px 20px;color:var(--text-muted)}
        .no-words-icon{font-size:48px;margin-bottom:15px}

        /* Lexicon Quest Styles - Single Card Design */
        .quiz-container {
            background: var(--bg-secondary);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            overflow: hidden;
            border: 1px solid var(--border-color);
            margin-bottom: 24px;
        }

        .question-card {
            padding: 30px;
        }

        .question-text {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--text-primary);
            line-height: 1.5;
            margin-bottom: 25px;
            padding: 20px;
            background: var(--bg-tertiary);
            border-radius: 12px;
            border-left: 4px solid var(--accent-primary);
        }

        .options-grid {
            display: grid;
            gap: 12px;
            margin-bottom: 25px;
        }

        .option-btn {
            padding: 18px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            background: var(--bg-tertiary);
            font-size: 1rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-primary);
        }

        .option-btn:hover {
            border-color: var(--accent-primary);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(200, 121, 65, 0.2);
        }

        .option-btn.selected {
            border-color: var(--accent-primary);
            background: var(--accent-primary);
            color: var(--bg-primary);
        }

        .option-btn.correct {
            background: rgba(123, 200, 127, 0.1);
            border-color: #7bc87f;
            color: #7bc87f;
        }

        .option-btn.incorrect {
            background: rgba(217, 83, 79, 0.1);
            border-color: #d9534f;
            color: #d9534f;
        }

        .explanation-box {
            background: var(--bg-tertiary);
            padding: 20px;
            border-radius: 12px;
            border-left: 4px solid var(--accent-primary);
            margin-top: 20px;
            display: none;
            color: var(--text-primary);
            font-size: 1rem;
            line-height: 1.5;
        }

        .explanation-box.show {
            display: block;
            animation: slideDown 0.3s ease;
        }

        .action-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 25px;
        }

        .quiz-take-btn {
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            border-radius: 50px;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(200,121,65,0.4);
            border-color: var(--accent-primary);
            width: auto;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        .quiz-take-btn:hover {
            box-shadow: 0 8px 24px rgba(200,121,65,0.5);
            transform: translateY(-2px);
        }

        .quiz-loading {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
        }

        .quiz-error {
            background: #3a1f1f;
            color: var(--error-color);
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: center;
            border-left: 4px solid var(--error-color);
        }

        /* IMPROVED: Word of the Day Progressive Disclosure Styles */
        .word-definition-preview {
            position: relative;
            max-height: 400px;
            overflow: hidden;
            transition: max-height 0.4s ease-in-out;
        }

        .word-definition-preview.expanded {
            max-height: none;
        }

        .definition-fade {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 80px;
            background: linear-gradient(transparent, var(--bg-secondary));
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .word-definition-preview.expanded .definition-fade {
            opacity: 0;
        }

        .read-more-container {
            display: flex;
            justify-content: center;
            margin-top: 20px;
            width: 100%;
        }

        .read-more-btn {
            background: var(--bg-secondary);
            color: var(--accent-primary);
            border: 2px solid var(--accent-primary);
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(200, 121, 65, 0.2);
            position: relative;
            overflow: hidden;
        }

        .read-more-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(200, 121, 65, 0.1), transparent);
            transition: left 0.5s;
        }

        .read-more-btn:hover::before {
            left: 100%;
        }

        .read-more-btn:hover {
            background: var(--accent-primary);
            color: var(--bg-primary);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(200, 121, 65, 0.4);
        }

        .read-more-btn .icon {
            transition: transform 0.3s ease;
            font-size: 12px;
        }

        .read-more-btn.expanded .icon {
            transform: rotate(180deg);
        }

        /* Mobile Optimizations */
        @media (max-width: 768px) {
            .quiz-container {
                border-radius: 16px;
            }
            
            .question-card {
                padding: 20px;
            }
            
            .question-text {
                font-size: 1.1rem;
                padding: 15px;
                margin-bottom: 20px;
            }
            
            .option-btn {
                padding: 15px;
                font-size: 0.95rem;
                min-height: 60px;
                display: flex;
                align-items: center;
            }
            
            .action-buttons {
                flex-direction: column;
                gap: 10px;
            }
            
            .explanation-box {
                padding: 15px;
                font-size: 0.9rem;
            }
            
            .quiz-take-btn {
                padding: 12px 20px;
                font-size: 14px;
            }
            
            /* Mobile-optimized skeleton loading */
            .skeleton-loading {
                padding: 20px;
            }
            
            .skeleton-title {
                height: 24px;
                margin-bottom: 15px;
                width: 60%;
            }
            
            .skeleton-line {
                height: 14px;
                margin-bottom: 10px;
            }
            
            .skeleton-line.long {
                width: 100%;
            }

            /* Mobile optimization for word preview */
            .word-definition-preview {
                max-height: 600px;
            }
            
            .definition-fade {
                height: 60px;
            }
        }

        @media (max-width: 480px) {
            .question-card {
                padding: 15px;
            }
            
            .question-text {
                font-size: 1rem;
                padding: 12px;
                line-height: 1.4;
            }
            
            .options-grid {
                gap: 8px;
            }
            
            .option-btn {
                padding: 12px;
                font-size: 0.9rem;
                min-height: 55px;
            }
            
            .explanation-box {
                padding: 12px;
                font-size: 0.85rem;
            }
            
            .quiz-take-btn {
                padding: 10px 18px;
                font-size: 13px;
            }
            
            /* Further mobile optimization for skeleton */
            .skeleton-loading {
                padding: 15px;
            }
            
            .skeleton-title {
                height: 20px;
                margin-bottom: 12px;
                width: 70%;
            }
            
            .skeleton-line {
                height: 12px;
                margin-bottom: 8px;
            }

            /* Mobile optimization for word preview */
            .word-definition-preview {
                max-height: 600px;
            }
            
            .definition-fade {
                height: 50px;
            }
            
            .read-more-btn {
                padding: 10px 20px;
                font-size: 13px;
            }
        }

        /* Search results positioning */
        #searchResultsColumn {
            order: -1;
        }

        .normal-order #searchResultsColumn {
            order: 0;
        }

        @media (max-width:968px){.hero-title{font-size:36px}.hero-subtitle{font-size:18px}.hero-section{padding:30px 20px}.search-container{max-width:90%}.container{padding:15px;max-width:100%}.words-column{padding:20px}.word-title{font-size:22px}.word-definition{font-size:16px}.word-definition h1{font-size:27px}.word-definition h2{font-size:24px}.word-definition h3{font-size:22px}.word-definition h4{font-size:20px}.word-definition h5{font-size:18px}.word-definition h6{font-size:16px}.section-title{font-size:20px}.btn-show-word{padding:12px 20px;font-size:15px}.search-box input{padding:16px 50px 16px 20px;font-size:16px}.search-icon{right:20px;width:20px;height:20px}.autocomplete-dropdown{left:20px;max-width:calc(100% - 70px)}.autocomplete-item{padding:14px 18px}.autocomplete-item:hover{padding-left:22px}.autocomplete-item.selected{padding-left:19px}.autocomplete-word{font-size:15px}}
        @media (max-width:480px){.hero-title{font-size:28px}.hero-subtitle{font-size:16px}.hero-section{padding:25px 15px}.search-box input{padding:14px 45px 14px 18px;font-size:15px}.search-icon{right:15px;width:18px;height:18px}.autocomplete-dropdown{left:18px;max-width:calc(100% - 63px)}.autocomplete-item{padding:12px 16px}.autocomplete-word{font-size:14px}.words-column{padding:15px}.word-title{font-size:20px}.word-definition{font-size:17px}.word-definition h1{font-size:25px}.word-definition h2{font-size:22px}.word-definition h3{font-size:20px}.word-definition h4{font-size:18px}.word-definition h5{font-size:16px}.word-definition h6{font-size:14px}.section-title{font-size:18px}.btn-show-word{padding:12px 20px;font-size:15px}}
    </style>
</head>
<body>
    <div class="hero-section">
        <h1 class="hero-title">The Only Dictionary You Ever Need</h1>
        <p class="hero-subtitle">Look up a word, learn it forever.</p>
        <div class="search-container">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search Dictionary..." autocomplete="off">
                <span class="search-icon">
                    <svg viewBox="0 0 24 24">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.35-4.35"></path>
                    </svg>
                </span>
            </div>
            <div class="autocomplete-dropdown" id="autocompleteDropdown"></div>
        </div>
    </div>
    <div class="container">
        <div class="main-content full-width" id="mainContent">
            <!-- Search Results Section - Now at the top when searching -->
            <div class="words-column" id="searchResultsColumn" style="display:none">
                <h2 class="section-title">Search Results</h2>
                <div id="wordsList"></div>
            </div>
            
            <!-- Lexicon Quest Section - Single Card Design -->
            <div class="quiz-container" id="quizPreviewSection">
                <div class="question-card">
                    <div class="quiz-loading" id="quizLoadingMessage">
                        <div class="skeleton-loading">
                            <div class="skeleton-title"></div>
                            <div class="skeleton-line long"></div>
                            <div class="skeleton-line long"></div>
                            <div class="skeleton-line long"></div>
                            <div class="skeleton-line long"></div>
                        </div>
                    </div>
                    <div class="quiz-error" id="quizErrorMessage" style="display: none;"></div>
                    
                    <div id="quizQuestion" style="display: none;">
                        <div class="question-text" id="quizQuestionText">
                            Loading question...
                        </div>
                        <div class="options-grid" id="quizOptionsGrid">
                            <!-- Quiz options will be inserted here -->
                        </div>
                        <div class="explanation-box" id="quizExplanation">
                            <strong>Explanation:</strong> <span id="quizExplanationText"></span>
                        </div>
                        <div class="action-buttons">
                            <button class="quiz-take-btn" onclick="continueToFullQuiz()" id="quizContinueBtn" style="display: none;">Take a quiz</button>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Word of the Day Section -->
            <div class="words-column" id="wordOfTheDaySection">
                <h2 class="section-title">Word of the Day</h2>
                <div id="randomWordDisplay"></div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
const SafeStorage = {
    isAvailable: false,
    memoryStorage: {},
    
    init: function() {
        try {
            const test = '__storage_test__';
            localStorage.setItem(test, test);
            localStorage.removeItem(test);
            this.isAvailable = true;
            console.log('localStorage is available');
        } catch(e) {
            console.warn('localStorage not available, using memory storage:', e);
            this.isAvailable = false;
        }
    },
    
    setItem: function(key, value) {
        try {
            if (this.isAvailable) {
                localStorage.setItem(key, value);
            }
            this.memoryStorage[key] = value;
        } catch(e) {
            console.warn('Storage setItem failed:', e);
            this.memoryStorage[key] = value;
        }
    },
    
    getItem: function(key) {
        try {
            if (this.isAvailable) {
                const value = localStorage.getItem(key);
                if (value !== null) return value;
            }
            return this.memoryStorage[key] || null;
        } catch(e) {
            console.warn('Storage getItem failed:', e);
            return this.memoryStorage[key] || null;
        }
    },
    
    removeItem: function(key) {
        try {
            if (this.isAvailable) {
                localStorage.removeItem(key);
            }
            delete this.memoryStorage[key];
        } catch(e) {
            console.warn('Storage removeItem failed:', e);
            delete this.memoryStorage[key];
        }
    }
};

// Fisher-Yates shuffle algorithm for randomizing arrays
function shuffleArray(array) {
    const shuffled = [...array];
    for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    return shuffled;
}

function buildSearchIndex() {

        id: item.id,
        word: item.word,
        wordLower: item.word.toLowerCase(),

    }));
}

function loadFromLocalStorage() {

    dictionary = localDict ? JSON.parse(localDict) : [];
    buildSearchIndex();
    return dictionary.length > 0;
}

async function initializeSupabase() {
    try {
        const { createClient } = supabase;

        isSupabaseConfigured = true;
        supabaseInitialized = true;

        isSupabaseConfigured = false;
        if (dictionary.length === 0) {
            displayWordOfTheDay();
        }
    }
}

async function syncWithSupabase() {
    if (!isSupabaseConfigured || !supabaseInitialized) return;
    
    try {
        const { data: dictData, error: dictError } = await supabaseClient
            .from('dictionary')
            .select('*')
            .order('word', { ascending: true });
        
        if (dictError) throw dictError;
        
        if (dictData && dictData.length > 0) {
            dictionary = dictData.map(item => ({
                id: item.id,
                word: item.word,
                definition: item.definition,
                dateAdded: item.date_added,
                dateModified: item.date_modified
            }));
            
            buildSearchIndex();
            SafeStorage.setItem('dictionary', JSON.stringify(dictionary));
            
            // Only show word of the day if we haven't already shown it
            if (!hasShownWordOfTheDay) {
                displayWordOfTheDay();
                hasShownWordOfTheDay = true;
            }
        }
    } catch(error) {
        console.error('Sync error:', error);
    }
}

// Quiz Functions - Optimized for faster loading
async function loadQuizQuestions() {
    try {
        console.log('Loading quiz questions...');
        
        // Try to load from cache first for faster display
        const cachedQuestions = SafeStorage.getItem('cachedQuizQuestions');
        if (cachedQuestions) {
            quizQuestions = JSON.parse(cachedQuestions);
            console.log('Loaded quiz questions from cache:', quizQuestions.length);
            
            // Show quiz immediately if we have cached questions
            document.getElementById('quizLoadingMessage').style.display = 'none';
            document.getElementById('quizQuestion').style.display = 'block';
            displayQuizQuestion();
        }
        
        // Always fetch fresh data in background
        const response = await fetch(`${SUPABASE_URL}/rest/v1/quiz_questions?select=*`, {
            headers: {
                'apikey': SUPABASE_ANON_KEY,
                'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                'Content-Type': 'application/json'
            }
        });
        
        if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
        }
        
        const freshQuestions = await response.json();
        console.log('Fresh quiz questions loaded:', freshQuestions.length);

        if (freshQuestions.length === 0) {
            showQuizError('No quiz questions found in the database.');
            return;
        }

        // Update cache with fresh data
        quizQuestions = freshQuestions;
        SafeStorage.setItem('cachedQuizQuestions', JSON.stringify(freshQuestions));
        
        // If we didn't have cached data, show the quiz now
        if (!cachedQuestions) {
            document.getElementById('quizLoadingMessage').style.display = 'none';
            document.getElementById('quizQuestion').style.display = 'block';
            displayQuizQuestion();
        }
        // If we had cached data, don't change the current question to avoid glitch
    } catch (error) {
        console.error('Error loading quiz questions:', error);
        // If we have cached questions, use them even if fetch fails
        if (quizQuestions.length > 0) {
            document.getElementById('quizLoadingMessage').style.display = 'none';
            document.getElementById('quizQuestion').style.display = 'block';
            displayQuizQuestion();
        } else {
            showQuizError(`Failed to load quiz: ${error.message}. Please check your Supabase configuration.`);
        }
    }
}

function showQuizError(message) {
    document.getElementById('quizLoadingMessage').style.display = 'none';
    document.getElementById('quizErrorMessage').style.display = 'block';
    document.getElementById('quizErrorMessage').textContent = message;
}

function displayQuizQuestion() {
    if (quizQuestions.length === 0) return;
    
    // Prevent multiple question displays
    if (questionDisplayed) return;
    questionDisplayed = true;
    
    // Get a random question
    const randomIndex = Math.floor(Math.random() * quizQuestions.length);
    currentQuizQuestion = quizQuestions[randomIndex];
    
    document.getElementById('quizQuestionText').textContent = currentQuizQuestion.question_text;
    
    // Create options with randomization
    const optionsGrid = document.getElementById('quizOptionsGrid');
    optionsGrid.innerHTML = '';
    
    // Make sure options is an array
    const optionsArray = Array.isArray(currentQuizQuestion.options) ? 
        currentQuizQuestion.options : 
        JSON.parse(currentQuizQuestion.options || '[]');
    
    // Store the original correct answer before shuffling
    const originalCorrectAnswer = optionsArray[currentQuizQuestion.correct_answer];
    
    // Shuffle the options array
    const shuffledOptions = shuffleArray(optionsArray);
    
    // Find the new position of the correct answer after shuffling
    const newCorrectAnswerIndex = shuffledOptions.indexOf(originalCorrectAnswer);
    
    // Update the question object with shuffled options and new correct answer index
    currentQuizQuestion.shuffledOptions = shuffledOptions;
    currentQuizQuestion.currentCorrectAnswer = newCorrectAnswerIndex;
    
    // Create the option buttons
    shuffledOptions.forEach((option, index) => {
        const optionDiv = document.createElement('button');
        optionDiv.className = 'option-btn';
        optionDiv.textContent = option;
        optionDiv.onclick = () => selectQuizAnswer(index);
        optionsGrid.appendChild(optionDiv);
    });

    // Reset UI state
    document.getElementById('quizExplanation').classList.remove('show');
    document.getElementById('quizContinueBtn').style.display = 'none';
    quizAnswered = false;
    selectedQuizAnswer = null;
}

function selectQuizAnswer(index) {
    if (quizAnswered) return;
    
    selectedQuizAnswer = index;
    quizAnswered = true;
    
    const options = document.querySelectorAll('.option-btn');
    options.forEach(opt => opt.classList.remove('selected'));
    options[index].classList.add('selected');
    
    // Immediately check the answer
    checkQuizAnswer();
}

function checkQuizAnswer() {
    quizAnswered = true;

    // Use the current correct answer index (after shuffling)
    const isCorrect = selectedQuizAnswer === currentQuizQuestion.currentCorrectAnswer;

    // Show explanation
    document.getElementById('quizExplanationText').textContent = currentQuizQuestion.explanation;
    document.getElementById('quizExplanation').classList.add('show');

    // Show continue button
    document.getElementById('quizContinueBtn').style.display = 'block';
    
    // Highlight correct and incorrect answers
    const options = document.querySelectorAll('.option-btn');
    
    // Highlight correct answer (using current correct answer index)
    options[currentQuizQuestion.currentCorrectAnswer].classList.add('correct');
    
    // If wrong answer, also highlight the incorrect choice
    if (!isCorrect) {
        options[selectedQuizAnswer].classList.add('incorrect');
    }
    
    // Disable all options after selection
    options.forEach(opt => {
        opt.style.cursor = 'default';
        opt.onclick = null;
    });
}

// IMPROVED: Word of the Day Progressive Disclosure 
function createExpandableDefinition(definitionHTML) {
    const tempDiv = document.createElement('div');
    tempDiv.innerHTML = definitionHTML;
    const textContent = tempDiv.textContent || tempDiv.innerText || '';
    
    // Check if definition is long enough to need expansion
    const isLongDefinition = textContent.length > 800 || definitionHTML.includes('<h1') || definitionHTML.includes('<h2') || definitionHTML.includes('<h3') || definitionHTML.includes('<ul') || definitionHTML.includes('<ol');
    
    if (!isLongDefinition) {
        return `
            <div class="word-entry">
                <div class="word-definition">
                    ${definitionHTML}
                </div>
                <button class="btn-show-word" onclick="showNewRandomWord()">Show another word</button>
            </div>
        `;
    }
    
    return `
        <div class="word-entry">
            <div class="word-definition-preview">
                <div class="word-definition">
                    ${definitionHTML}
                    <button class="btn-show-word" onclick="showNewRandomWord()">Show another word</button>
                </div>
                <div class="definition-fade"></div>
            </div>
            <div class="read-more-container">
                <button class="read-more-btn" onclick="toggleDefinitionExpansion(this)">
                    <span>Read more</span>
                    <span class="icon">▼</span>
                </button>
            </div>
        </div>
    `;
}

function toggleDefinitionExpansion(button) {
    const preview = button.closest('.word-entry').querySelector('.word-definition-preview');
    const isExpanded = preview.classList.contains('expanded');
    
    if (isExpanded) {
        preview.classList.remove('expanded');
        button.innerHTML = '<span>Read more</span><span class="icon">▼</span>';
        button.classList.remove('expanded');
        
        // Scroll to keep the preview in view
        setTimeout(() => {
            preview.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, 300);
    } else {
        preview.classList.add('expanded');
        button.innerHTML = '<span>Read less</span><span class="icon">▼</span>';
        button.classList.add('expanded');
    }
}

// OPTIMIZED SEARCH WITH TYPING DETECTION
function showAutocomplete(s){
    const d=document.getElementById('autocompleteDropdown');
    if(!s){d.classList.remove('show');return}
    
    if(!searchIndex) return;
    
    const sLower = s.toLowerCase();
    const matches = [];
    const maxResults = 8;
    
    for(let i = 0; i < searchIndex.length && matches.length < maxResults; i++){
        const item = searchIndex[i];
        if(item.wordLower.startsWith(sLower)){
            matches.push(item);
        }
    }
    
    if(matches.length < maxResults){
        for(let i = 0; i < searchIndex.length && matches.length < maxResults; i++){
            const item = searchIndex[i];
            if(!matches.some(m => m.id === item.id) && item.wordLower.includes(sLower)){
                matches.push(item);
            }
        }
    }
    
    if(matches.length===0){d.classList.remove('show');return}
    
    let html = '';
    matches.forEach((item,idx)=>{
        const word = dictionary.find(w=>w.id===item.id);
        const escapedWord = word.word.replace(/'/g,"\\'");
        html += `<div class="autocomplete-item" data-index="${idx}" onclick="selectAutocompleteItem('${escapedWord}')"><div class="autocomplete-word">${word.word}</div></div>`;
    });
    d.innerHTML=html;
    d.classList.add('show');
    selectedAutocompleteIndex=-1;
}

function selectAutocompleteItem(w){
    document.getElementById('searchInput').value=w;
    document.getElementById('autocompleteDropdown').classList.remove('show');
    const s=w.toLowerCase();
    displaySearchResults(s);
}

// OPTIMIZED TYPING DETECTION - Wait for user to stop typing
document.getElementById('searchInput').addEventListener('input',function(e){
    const s=e.target.value;
    
    // Clear previous timer
    clearTimeout(typingTimer);
    
    // Hide dropdown if empty
    if(!s) {
        document.getElementById('autocompleteDropdown').classList.remove('show');
        document.getElementById('searchResultsColumn').style.display='none';
        // Reset to normal order when search is cleared
        document.getElementById('mainContent').classList.add('normal-order');
        return;
    }
    
    // Wait 300ms after user stops typing before searching
    typingTimer = setTimeout(() => {
        showAutocomplete(s);
        if(s) displaySearchResults(s);
    }, 300);
});

document.getElementById('searchInput').addEventListener('keydown',function(e){
    const d=document.getElementById('autocompleteDropdown'),it=d.querySelectorAll('.autocomplete-item');
    if(!d.classList.contains('show')||it.length===0)return;
    if(e.key==='ArrowDown'){
        e.preventDefault();
        selectedAutocompleteIndex=Math.min(selectedAutocompleteIndex+1,it.length-1);
        updateAutocompleteSelection(it);
    }else if(e.key==='ArrowUp'){
        e.preventDefault();
        selectedAutocompleteIndex=Math.max(selectedAutocompleteIndex-1,-1);
        updateAutocompleteSelection(it);
    }else if(e.key==='Enter'&&selectedAutocompleteIndex>=0){
        e.preventDefault();
        it[selectedAutocompleteIndex].click();
    }else if(e.key==='Escape'){
        d.classList.remove('show');
        selectedAutocompleteIndex=-1;
    }
});

function updateAutocompleteSelection(it){
    it.forEach((i,idx)=>{
        if(idx===selectedAutocompleteIndex){
            i.classList.add('selected');
            i.scrollIntoView({block:'nearest'});
        }else i.classList.remove('selected');
    });
}

document.addEventListener('click',function(e){
    const sc=document.querySelector('.search-container'),d=document.getElementById('autocompleteDropdown');
    if(!sc.contains(e.target)){
        d.classList.remove('show');
        selectedAutocompleteIndex=-1;
    }
});

function displaySearchResults(s){
    const wl=document.getElementById('wordsList'),sr=document.getElementById('searchResultsColumn');
    
    if(!searchIndex){
        sr.style.display='none';
        return;
    }
    
    const sLower = s.toLowerCase();
    const matches = searchIndex.filter(item=>item.wordLower.includes(sLower));
    
    if(matches.length===0){
        wl.innerHTML=`<div class="no-words"><div class="no-words-icon">📖</div><p>No words found matching "${s}"</p></div>`;
    }else{
        const sortedMatches = matches.sort((a,b)=>a.word.localeCompare(b.word));
        let html = '';
        sortedMatches.forEach(item => {
            const word = dictionary.find(w=>w.id===item.id);
            html += `<div class="word-entry"><div class="word-definition">${word.definition}</div></div>`;
        });
        wl.innerHTML = html;
    }
    
    // Show search results at the top
    sr.style.display='block';
    document.getElementById('mainContent').classList.remove('normal-order');
    
    // Scroll to search results
    setTimeout(() => {
        sr.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 100);
}

function getWordOfTheDay() {
    if (!dictionary || dictionary.length === 0) {
        return null;
    }
    
    const today = new Date();
    const dateString = today.getFullYear() + '-' + 
                      String(today.getMonth() + 1).padStart(2, '0') + '-' + 
                      String(today.getDate()).padStart(2, '0');
    
    let hash = 0;
    for (let i = 0; i < dateString.length; i++) {
        hash = ((hash << 5) - hash) + dateString.charCodeAt(i);
        hash = hash & hash;
    }
    
    const index = Math.abs(hash) % dictionary.length;
    return dictionary[index];
}

function displayWordOfTheDay(){
    const rd=document.getElementById('randomWordDisplay');
    
    if(!dictionary || dictionary.length===0){
        rd.innerHTML='<div class="no-words"><div class="no-words-icon">📚</div><p>No words yet!</p></div>';
        return;
    }
    
    const wordOfDay = getWordOfTheDay();
    if (wordOfDay) {
        rd.innerHTML = createExpandableDefinition(wordOfDay.definition);
    }
}

function showNewRandomWord(){
    if(dictionary.length>0){
        const rd=document.getElementById('randomWordDisplay');
        const ri=Math.floor(Math.random()*dictionary.length);
        const rw=dictionary[ri];
        rd.innerHTML = createExpandableDefinition(rw.definition);
        document.getElementById('wordOfTheDaySection').scrollIntoView({behavior:'smooth',block:'start'});
    }
}
