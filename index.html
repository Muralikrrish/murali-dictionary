<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Admin — Dictionary</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial}
        .container{max-width:1200px;margin:0 auto;padding:20px}
        header{display:flex;justify-content:space-between;align-items:center}
        .section-title{font-size:20px;margin:20px 0}
        #sidebar{position:fixed;right:10px;top:80px;width:300px;background:#f9f9f9;padding:10px;border:1px solid #eee;border-radius:8px}
        .hidden{display:none}
        .btn{display:inline-block;padding:8px 12px;border-radius:6px;border:1px solid #ccc;background:#fff;cursor:pointer}
        .btn-primary{background:#0b74de;color:#fff;border:none}
        .word-item{padding:8px;border-bottom:1px solid #eee}
        .quick-add-list{list-style:none;padding:0;margin:0}
        .search-results{border:1px solid #ddd;padding:8px;border-radius:6px;background:#fff}
        .editor{width:100%;height:120px;padding:8px;border:1px solid #ccc;border-radius:6px}
        .small{font-size:12px;color:#666}
        /* shimmer example */
        .shimmer{background:linear-gradient(90deg,#f6f6f6 25%,#ededed 37%,#f6f6f6 63%);background-size:400% 100%;animation:shimmer 1.4s linear infinite;border-radius:6px}
        @keyframes shimmer{0%{background-position:100% 50%}100%{background-position:0% 50%}}
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>Admin — Dictionary</h1>
        <div>
            <button id="toggleAdminBtn" class="btn">Toggle Admin Mode</button>
            <button id="exportBtn" class="btn">Export</button>
        </div>
    </header>

    <section id="statsSection">
        <h2 class="section-title">Stats</h2>
        <div id="stats" class="small">Loading stats…</div>
    </section>

    <section id="wordOfTheDaySection">
        <h2 class="section-title">Word of the Day</h2>
        <div id="wotd" class="small">Not set</div>
    </section>

    <section id="quickAddSection">
        <h2 class="section-title" style="margin-top:40px">Quick Add <span id="quickAddCount">(0)</span></h2>
        <ul id="quickAddList" class="quick-add-list"></ul>
    </section>

    <section id="addWordSection">
        <h2 class="section-title">Add / Edit Word</h2>
        <form id="addWordForm">
            <div>
                <label for="wordInput">Word</label><br/>
                <input id="wordInput" required />
            </div>
            <div style="margin-top:8px">
                <label for="definitionInput">Definition</label><br/>
                <textarea id="definitionInput" class="editor"></textarea>
            </div>
            <div style="margin-top:8px">
                <button type="submit" id="addToDictionaryBtn" class="btn btn-primary">Add to dictionary</button>
                <button type="button" id="updateBtn" class="btn hidden">Update</button>
                <button type="button" id="cancelEditBtn" class="btn hidden">Cancel</button>
            </div>
        </form>
    </section>

    <section id="searchSection" style="margin-top:32px">
        <h2 class="section-title">Search / Edit</h2>
        <input id="editSearchInput" placeholder="Search words to edit..." />
        <div id="editSearchResults" class="search-results" style="margin-top:8px"></div>
    </section>

    <section id="wordsListSection" style="margin-top:32px">
        <h2 class="section-title">All Words</h2>
        <div id="wordsList"></div>
    </section>
</div>

<div id="sidebar">
    <div class="small">Quick Controls</div>
    <div style="margin-top:8px">
        <button id="openAddBtn" class="btn">Open Add</button>
        <button id="openSearchBtn" class="btn">Open Search</button>
    </div>
    <div style="margin-top:12px" id="definitionSearchResults"></div>
</div>

<script>
/* ========= Data storage helpers ========= */
const STORAGE_KEY = 'my_dictionary_v1';
let dictionary = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');

/* ========= Utility ========= */
function saveDictionary(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(dictionary));
}

function formatHtml(s){
    if(!s) return '';
    // very small sanitizer: escape angle brackets
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}

/* ========= UI rendering ========= */
function displayWords(filter=''){
    const wl = document.getElementById('wordsList');
    wl.innerHTML = '';
    const list = dictionary
        .filter(i => !filter || i.word.toLowerCase().includes(filter.toLowerCase()))
        .sort((a,b)=> a.word.localeCompare(b.word));
    list.forEach(item=>{
        const div = document.createElement('div');
        div.className = 'word-item';
        div.innerHTML = `<strong>${item.word}</strong> <div class="small">${formatHtml(item.definition || '')}</div>`;
        wl.appendChild(div);
    });
    document.getElementById('quickAddCount').textContent = `(${dictionary.length})`;
}

/* ========= Remove automatic scrolling ========= */
/* All automatic scrolling actions were removed to prevent
   the page from jumping. Where a scroll previously happened,
   the code has been replaced with short comments to indicate
   the edit. If you want to restore controlled scrolling later,
   add an explicit function call in response to a user action. */

/* Keep a stub for compatibility */
function scrollToAddSection() {
    // automatic scroll removed by edit; function intentionally left blank
}

/* ========= Form handling (add / update) ========= */
const addWordForm = document.getElementById('addWordForm');
const wordInput = document.getElementById('wordInput');
const definitionInput = document.getElementById('definitionInput');
const addToDictionaryBtn = document.getElementById('addToDictionaryBtn');
const updateBtn = document.getElementById('updateBtn');
const cancelEditBtn = document.getElementById('cancelEditBtn');

let editingId = null;

addWordForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const w = wordInput.value.trim();
    const d = definitionInput.value.trim();
    if(!w) return alert('Word required');
    if(editingId){
        const idx = dictionary.findIndex(x=>x.id===editingId);
        if(idx !== -1){
            dictionary[idx].word = w;
            dictionary[idx].definition = d;
            dictionary[idx].dateModified = new Date().toISOString();
            editingId = null;
            updateBtn.classList.add('hidden');
            cancelEditBtn.classList.add('hidden');
            addToDictionaryBtn.classList.remove('hidden');
            wordInput.value = '';
            definitionInput.value = '';
            displayWords();
            // automatic scroll removed by edit; original target: quickAddSection
            saveDictionary();
        }
    } else {
        const newWord = { id: Date.now(), word: w, definition: d, dateAdded: new Date().toISOString() };
        dictionary.push(newWord);
        wordInput.value = '';
        definitionInput.value = '';
        displayWords();
        // automatic scroll removed by edit; original target: quickAddSection
        saveDictionary();
    }
});

/* ========= Simple search / edit UI ========= */
document.getElementById('editSearchInput').addEventListener('input', (e)=>{
    const q = e.target.value.trim().toLowerCase();
    const r = document.getElementById('editSearchResults');
    if(!q){ r.innerHTML = ''; return; }
    const matches = dictionary.filter(i => i.word.toLowerCase().includes(q) || (i.definition || '').toLowerCase().includes(q));
    r.innerHTML = matches.map(m => `<div class="word-item"><strong>${m.word}</strong><div class="small">${formatHtml(m.definition)}</div>
        <div style="margin-top:6px"><button class="btn" data-id="${m.id}" onclick="startEdit(${m.id})">Edit</button></div>
    </div>`).join('');
    // automatic scroll removed by edit; original target: sidebar
});

function startEdit(id){
    const entry = dictionary.find(i => i.id === id);
    if(!entry) return;
    editingId = id;
    wordInput.value = entry.word;
    definitionInput.value = entry.definition;
    addToDictionaryBtn.classList.add('hidden');
    updateBtn.classList.remove('hidden');
    cancelEditBtn.classList.remove('hidden');
    // automatic scroll removed by edit; original target: document.getElementById('wordOfTheDaySection')
}

cancelEditBtn.addEventListener('click', ()=>{
    editingId = null;
    wordInput.value = '';
    definitionInput.value = '';
    updateBtn.classList.add('hidden');
    cancelEditBtn.classList.add('hidden');
    addToDictionaryBtn.classList.remove('hidden');
});

/* ========= Sidebar and helper controls ========= */
document.getElementById('openAddBtn').addEventListener('click', ()=>{
    // open add UI — no automatic scroll
    document.getElementById('wordInput').focus();
});

document.getElementById('openSearchBtn').addEventListener('click', ()=>{
    // open search UI — no automatic scroll
    document.getElementById('editSearchInput').focus();
});

/* ========= Fake definition search (example) ========= */
function searchDefinition(term){
    const results = document.getElementById('definitionSearchResults');
    results.innerHTML = '';
    if(!term) {
        // automatic scroll removed by edit; original target: sidebar
        return;
    }
    // pretend we found things
    results.innerHTML = `<div class="small">Definitions for <strong>${term}</strong> (simulated)</div>`;
}

/* ========= Export / Import / Toggle admin ========= */
document.getElementById('exportBtn').addEventListener('click', ()=>{
    const dataStr = JSON.stringify(dictionary, null, 2);
    const blob = new Blob([dataStr], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'dictionary-export.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
});

document.getElementById('toggleAdminBtn').addEventListener('click', ()=>{
    const sb = document.getElementById('sidebar');
    sb.style.display = sb.style.display === 'none' ? 'block' : 'none';
    // automatic scroll removed by edit; original target: sidebar
});

/* ========= Init ========= */
displayWords();

/* Example: expose some helpers to global for quick console debugging */
window._DICT = dictionary;
window.startEdit = startEdit;
window.searchDefinition = searchDefinition;

</script>
</body>
</html>
