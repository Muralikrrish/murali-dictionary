<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Murali's English Dictionary</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Lora',serif}body{background:#1a1a1a;color:#e8e8e8;line-height:1.6}
        @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
        @keyframes slideDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
        @keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
        .loading-container{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px;gap:24px}
        .loading-spinner{width:48px;height:48px;border:4px solid #3d3d3d;border-top:4px solid #c87941;border-radius:50%;animation:spin 1s linear infinite}
        .loading-text{font-size:18px;color:#b8b8b8;font-weight:500;animation:pulse 2s ease-in-out infinite}
        .loading-subtext{font-size:14px;color:#666;margin-top:-12px}
        .hero-section{background:linear-gradient(135deg,#242424 0%,#1f1f1f 100%);padding:40px 30px;text-align:center;color:#e8e8e8}
        .hero-title{font-size:48px;font-weight:700;margin-bottom:20px;text-shadow:0 2px 8px rgba(200,121,65,0.3)}
        .hero-subtitle{font-size:20px;margin-bottom:40px;opacity:0.85}
        .search-container{max-width:550px;margin:0 auto;position:relative}
        .search-box{position:relative;background:#242424;border-radius:50px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,0.4);border:1px solid #3d3d3d;transition:all 0.3s ease}
        .search-box:focus-within{box-shadow:0 8px 32px rgba(200,121,65,0.4);border-color:#c87941}
        .search-box input{width:100%;padding:20px 60px 20px 30px;font-size:18px;border:none;outline:none;background:transparent;color:#e8e8e8}
        .search-box input::placeholder{color:#888}
        .search-icon{position:absolute;right:25px;top:50%;transform:translateY(-50%);color:#888;pointer-events:none;width:24px;height:24px}
        .search-icon svg{width:100%;height:100%;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
        .autocomplete-dropdown{position:absolute;top:calc(100% + 8px);left:0;right:0;background:#2a2a2a;border:1px solid #c87941;border-radius:16px;box-shadow:0 12px 32px rgba(0,0,0,0.5);max-height:320px;overflow-y:auto;display:none;z-index:1000;animation:slideDown 0.25s cubic-bezier(0.16,1,0.3,1)}
        .autocomplete-dropdown.show{display:block}
        .autocomplete-item{padding:16px 20px;cursor:pointer;border-bottom:1px solid #3a3a3a;transition:all 0.2s}
        .autocomplete-item:hover{background:#333}
        .autocomplete-word{font-weight:600;color:#e8e8e8;font-size:16px}
        .container{max-width:1000px;margin:0 auto;padding:30px}
        .main-content{display:grid;grid-template-columns:1fr;gap:20px}
        .words-column{background:#242424;padding:30px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,0.3);border:1px solid #3d3d3d}
        .sidebar{background:#242424;padding:30px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,0.3);height:fit-content;min-height:600px;border:1px solid #3d3d3d}
        .section-title{font-size:22px;font-weight:600;color:#e8e8e8;margin-bottom:15px;padding-bottom:10px;border-bottom:2px solid #c87941}
        .form-group{margin-bottom:20px}
        .form-group label{display:block;margin-bottom:8px;font-weight:600;color:#b8b8b8;font-size:14px}
        .form-group input{width:100%;padding:12px;border:1px solid #3d3d3d;border-radius:6px;font-size:15px;background:#1a1a1a;color:#e8e8e8}
        .form-group input:focus{outline:none;border-color:#c87941}
        .editor-toolbar{display:flex;gap:5px;margin-bottom:10px;flex-wrap:wrap;padding:10px;background:#1a1a1a;border:1px solid #3d3d3d;border-radius:6px 6px 0 0}
        .editor-btn{background:#242424;border:1px solid #3d3d3d;padding:8px 12px;border-radius:4px;cursor:pointer;font-size:14px;font-weight:600;color:#e8e8e8}
        .editor-btn:hover{background:#c87941;color:#1a1a1a}
        .editor-content{width:100%;min-height:400px;padding:12px;border:1px solid #3d3d3d;border-radius:0 0 6px 6px;border-top:none;font-size:16px;overflow-y:auto;background:#1a1a1a;color:#d8d8d8;line-height:1.6}
        .editor-content:focus{outline:none}
        .btn{background:linear-gradient(135deg,#c87941 0%,#d89057 100%);color:#1a1a1a;border:none;padding:14px 28px;border-radius:6px;font-size:16px;font-weight:600;cursor:pointer;width:100%;box-shadow:0 4px 12px rgba(200,121,65,0.3)}
        .btn:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(200,121,65,0.4)}
        .btn-show-word{background:#242424;color:#e8e8e8;border:1px solid #c87941;border-radius:50px;padding:12px 24px;font-size:15px;font-weight:600;cursor:pointer;margin:20px auto;display:block;width:auto}
        .btn-show-word:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(200,121,65,0.5)}
        .btn-secondary{background:#242424;color:#c87941;border:2px solid #c87941;margin-top:10px}
        .word-entry{padding:15px 0;border-bottom:1px solid #3d3d3d}
        .word-entry:last-child{border-bottom:none}
        .word-title{font-size:26px;font-weight:700;color:#e8e8e8;margin-bottom:12px}
        .word-definition{font-size:16px;color:#d8d8d8;line-height:1.6;margin-bottom:15px}
        .word-actions{display:flex;gap:15px;flex-wrap:wrap}
        .btn-action{padding:8px 16px;font-size:13px;border-radius:6px;border:none;cursor:pointer;font-weight:600}
        .btn-edit{background:#242424;color:#c87941;border:1px solid #c87941}
        .btn-edit:hover{background:#c87941;color:#1a1a1a}
        .btn-delete{background:#242424;color:#d9534f;border:1px solid #d9534f}
        .btn-delete:hover{background:#d9534f;color:#1a1a1a}
        .no-words{text-align:center;padding:60px 20px;color:#666}
        .no-words-icon{font-size:48px;margin-bottom:15px}
        .admin-mode{display:none}
        .admin-toggle{position:fixed;bottom:20px;right:20px;width:50px;height:50px;background:#242424;border-radius:50%;border:1px solid #3d3d3d;color:#888;font-size:24px;cursor:pointer;z-index:1000}
        .admin-toggle:hover{background:#2d2d2d;transform:scale(1.1)}
        .password-modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:2000;align-items:center;justify-content:center}
        .password-modal.show{display:flex}
        .password-box{background:#242424;padding:40px;border-radius:8px;max-width:400px;width:90%;border:1px solid #3d3d3d}
        .password-box h3{margin-bottom:20px;color:#e8e8e8}
        .password-box input{width:100%;padding:12px;border:1px solid #3d3d3d;border-radius:6px;font-size:15px;margin-bottom:20px;background:#1a1a1a;color:#e8e8e8}
        .password-box button{width:100%;padding:12px;background:#c87941;color:#1a1a1a;border:none;border-radius:6px;font-size:16px;font-weight:600;cursor:pointer}
        .password-box .cancel-btn{background:#3d3d3d;color:#e8e8e8;margin-top:10px}
        @media (max-width:768px){.hero-title{font-size:32px}.container{padding:15px}.words-column,.sidebar{padding:20px}}
    </style>
</head>
<body>
    <div class="hero-section">
        <h1 class="hero-title" id="heroTitle">The Only Dictionary You Ever Need</h1>
        <p class="hero-subtitle">Look up a word, learn it forever.</p>
        <div class="search-container">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search Dictionary..." autocomplete="off">
                <span class="search-icon">
                    <svg viewBox="0 0 24 24">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.35-4.35"></path>
                    </svg>
                </span>
            </div>
            <div class="autocomplete-dropdown" id="autocompleteDropdown"></div>
        </div>
    </div>
    
    <div class="container">
        <div class="main-content" id="mainContent">
            <div class="words-column" id="searchResultsColumn" style="display:none">
                <h2 class="section-title">Search Results</h2>
                <div id="wordsList"></div>
            </div>
            
            <div class="words-column" id="wordOfTheDaySection">
                <h2 class="section-title">Word of the Day</h2>
                <div id="randomWordDisplay">
                    <div class="loading-container">
                        <div class="loading-spinner"></div>
                        <div class="loading-text">Loading your dictionary</div>
                        <div class="loading-subtext">Just a moment...</div>
                    </div>
                </div>
                <button class="btn-show-word" onclick="showNewRandomWord()">Show another word</button>
            </div>
            
            <div class="sidebar admin-mode" id="sidebar">
                <h2 class="section-title">Add New Word</h2>
                <form id="addWordForm">
                    <div class="form-group">
                        <label for="wordInput">Word</label>
                        <input type="text" id="wordInput" required placeholder="Enter word">
                    </div>
                    <div class="form-group">
                        <label for="definitionInput">Definition</label>
                        <div class="editor-toolbar">
                            <button type="button" class="editor-btn" onclick="formatText('bold')"><b>B</b></button>
                            <button type="button" class="editor-btn" onclick="formatText('italic')"><i>I</i></button>
                            <button type="button" class="editor-btn" onclick="formatText('underline')"><u>U</u></button>
                        </div>
                        <div id="definitionInput" class="editor-content" contenteditable="true"></div>
                    </div>
                    <button type="submit" class="btn">Add to Dictionary</button>
                </form>
            </div>
        </div>
    </div>
    
    <button class="admin-toggle" id="adminToggle" onclick="showPasswordModal()">🔒</button>
    
    <div class="password-modal" id="passwordModal">
        <div class="password-box">
            <h3>Enter Admin Password</h3>
            <input type="password" id="passwordInput" placeholder="Password" onkeypress="if(event.key==='Enter')checkPassword()">
            <button onclick="checkPassword()">Login</button>
            <button class="cancel-btn" onclick="hidePasswordModal()">Cancel</button>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
// Memory storage fallback
const MemoryStorage = {
    data: {},
    setItem: function(key, value) { this.data[key] = value; },
    getItem: function(key) { return this.data[key] || null; },
    removeItem: function(key) { delete this.data[key]; }
};

// Safe storage wrapper
const SafeStorage = {
    storage: null,
    
    init: function() {
        try {
            localStorage.setItem('test', 'test');
            localStorage.removeItem('test');
            this.storage = localStorage;
        } catch(e) {
            console.warn('localStorage not available, using memory');
            this.storage = MemoryStorage;
        }
    },
    
    setItem: function(key, value) {
        try {
            this.storage.setItem(key, value);
        } catch(e) {
            console.error('Storage error:', e);
        }
    },
    
    getItem: function(key) {
        try {
            return this.storage.getItem(key);
        } catch(e) {
            return null;
        }
    },
    
    removeItem: function(key) {
        try {
            this.storage.removeItem(key);
        } catch(e) {
            console.error('Storage error:', e);
        }
    }
};

SafeStorage.init();

// Supabase config
const SUPABASE_URL = 'https://jlzzxruwxyzswzgppkgq.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impsenp4cnV3eHl6c3d6Z3Bwa2dxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjE5MjEyNDksImV4cCI6MjA3NzQ5NzI0OX0.fgL70q1wRSWH4OOn3x_Gh76EZA0JIxGJsWfMTPpSBZM';

let supabaseClient;
let dictionary = [];
let isAdmin = SafeStorage.getItem('isAdmin') === 'true';
const ADMIN_PASSWORD = '7412';

// Format text helper
function formatText(command) {
    document.execCommand(command, false, null);
}

// Load from local storage
function loadFromLocalStorage() {
    const stored = SafeStorage.getItem('dictionary');
    if (stored) {
        try {
            dictionary = JSON.parse(stored);
            return true;
        } catch(e) {
            console.error('Parse error:', e);
        }
    }
    return false;
}

// Save to local storage
function saveToLocalStorage() {
    try {
        SafeStorage.setItem('dictionary', JSON.stringify(dictionary));
    } catch(e) {
        console.error('Save error:', e);
    }
}

// Initialize Supabase
async function initializeSupabase() {
    try {
        const { createClient } = supabase;
        supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        // Try to load from Supabase
        const { data, error } = await supabaseClient
            .from('dictionary')
            .select('*')
            .order('word', { ascending: true });
        
        if (!error && data && data.length > 0) {
            dictionary = data.map(item => ({
                id: item.id,
                word: item.word,
                definition: item.definition,
                dateAdded: item.date_added
            }));
            saveToLocalStorage();
        }
    } catch(error) {
        console.error('Supabase error:', error);
    }
    
    // Always display content, even if Supabase fails
    if (isAdmin) {
        displayWords();
    } else {
        displayRandomWord();
    }
}

// Save dictionary to Supabase
async function saveDictionary() {
    saveToLocalStorage();
    
    if (supabaseClient) {
        try {
            const dataToSave = dictionary.map(w => ({
                id: w.id,
                word: w.word,
                definition: w.definition,
                date_added: w.dateAdded || new Date().toISOString()
            }));
            
            await supabaseClient
                .from('dictionary')
                .upsert(dataToSave, { onConflict: 'id' });
        } catch(e) {
            console.error('Save to Supabase failed:', e);
        }
    }
}

// Get word of the day (deterministic based on date)
function getWordOfTheDay() {
    if (!dictionary || dictionary.length === 0) return null;
    
    const today = new Date();
    const dateString = `${today.getFullYear()}-${today.getMonth()}-${today.getDate()}`;
    
    let hash = 0;
    for (let i = 0; i < dateString.length; i++) {
        hash = ((hash << 5) - hash) + dateString.charCodeAt(i);
    }
    
    const index = Math.abs(hash) % dictionary.length;
    return dictionary[index];
}

// Display random word
function displayRandomWord() {
    const display = document.getElementById('randomWordDisplay');
    
    if (!dictionary || dictionary.length === 0) {
        display.innerHTML = '<div class="no-words"><div class="no-words-icon">📚</div><p>No words in dictionary yet!</p></div>';
        return;
    }
    
    const word = getWordOfTheDay();
    if (word) {
        display.innerHTML = `<div class="word-entry"><div class="word-definition">${word.definition}</div></div>`;
    }
}

// Show new random word
function showNewRandomWord() {
    if (dictionary.length > 0) {
        const randomIndex = Math.floor(Math.random() * dictionary.length);
        const word = dictionary[randomIndex];
        document.getElementById('randomWordDisplay').innerHTML = 
            `<div class="word-entry"><div class="word-definition">${word.definition}</div></div>`;
    }
}

// Display words (admin view)
function displayWords(searchTerm = '') {
    const list = document.getElementById('wordsList');
    let filtered = searchTerm 
        ? dictionary.filter(w => w.word.toLowerCase().includes(searchTerm.toLowerCase()))
        : dictionary;
    
    filtered.sort((a, b) => a.word.localeCompare(b.word));
    
    if (filtered.length === 0) {
        list.innerHTML = '<div class="no-words"><div class="no-words-icon">📚</div><p>No words found</p></div>';
        return;
    }
    
    list.innerHTML = filtered.map(w => `
        <div class="word-entry">
            <div class="word-title">${w.word}</div>
            <div class="word-definition">${w.definition}</div>
            <div class="word-actions">
                <button class="btn-action btn-edit" onclick="editWord(${w.id})">Edit</button>
                <button class="btn-action btn-delete" onclick="deleteWord(${w.id})">Delete</button>
            </div>
        </div>
    `).join('');
}

// Search functionality
function showAutocomplete(search) {
    const dropdown = document.getElementById('autocompleteDropdown');
    
    if (!search) {
        dropdown.classList.remove('show');
        return;
    }
    
    const matches = dictionary
        .filter(w => w.word.toLowerCase().includes(search.toLowerCase()))
        .slice(0, 5);
    
    if (matches.length === 0) {
        dropdown.classList.remove('show');
        return;
    }
    
    dropdown.innerHTML = matches.map(w => 
        `<div class="autocomplete-item" onclick="selectWord('${w.word.replace(/'/g, "\\'")}')">
            <div class="autocomplete-word">${w.word}</div>
        </div>`
    ).join('');
    
    dropdown.classList.add('show');
}

function selectWord(word) {
    document.getElementById('searchInput').value = word;
    document.getElementById('autocompleteDropdown').classList.remove('show');
    
    if (isAdmin) {
        displayWords(word);
    } else {
        displaySearchResults(word);
    }
}

function displaySearchResults(search) {
    const results = dictionary.filter(w => w.word.toLowerCase().includes(search.toLowerCase()));
    const list = document.getElementById('wordsList');
    const column = document.getElementById('searchResultsColumn');
    
    if (results.length > 0) {
        list.innerHTML = results.map(w => 
            `<div class="word-entry"><div class="word-definition">${w.definition}</div></div>`
        ).join('');
        column.style.display = 'block';
    } else {
        column.style.display = 'none';
    }
}

// Search input handler
document.getElementById('searchInput').addEventListener('input', function(e) {
    const search = e.target.value;
    showAutocomplete(search);
    
    if (isAdmin && search) {
        displayWords(search);
    } else if (!isAdmin && search) {
        displaySearchResults(search);
    } else if (!isAdmin) {
        document.getElementById('searchResultsColumn').style.display = 'none';
    }
});

// Close dropdown when clicking outside
document.addEventListener('click', function(e) {
    if (!e.target.closest('.search-container')) {
        document.getElementById('autocompleteDropdown').classList.remove('show');
    }
});

// Add word form
document.getElementById('addWordForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const word = document.getElementById('wordInput').value.trim();
    const definition = document.getElementById('definitionInput').innerHTML.trim();
    
    if (!word || !definition) {
        alert('Please enter both word and definition');
        return;
    }
    
    const newWord = {
        id: Date.now(),
        word: word,
        definition: definition,
        dateAdded: new Date().toISOString()
    };
    
    dictionary.push(newWord);
    await saveDictionary();
    displayWords();
    
    document.getElementById('wordInput').value = '';
    document.getElementById('definitionInput').innerHTML = '';
});

// Edit word
async function editWord(id) {
    const word = dictionary.find(w => w.id === id);
    if (word) {
        document.getElementById('wordInput').value = word.word;
        document.getElementById('definitionInput').innerHTML = word.definition;
        
        // Remove old entry
        dictionary = dictionary.filter(w => w.id !== id);
        await saveDictionary();
        displayWords();
    }
}

// Delete word
async function deleteWord(id) {
    const word = dictionary.find(w => w.id === id);
    if (word && confirm(`Delete "${word.word}"?`)) {
        dictionary = dictionary.filter(w => w.id !== id);
        
        if (supabaseClient) {
            try {
                await supabaseClient.from('dictionary').delete().eq('id', id);
            } catch(e) {
                console.error('Delete error:', e);
            }
        }
        
        await saveDictionary();
        displayWords();
    }
}

// Admin functions
function checkAdminStatus() {
    const sidebar = document.getElementById('sidebar');
    const toggle = document.getElementById('adminToggle');
    const title = document.getElementById('heroTitle');
    
    if (isAdmin) {
        sidebar.style.display = 'block';
        toggle.textContent = '🔓';
        title.textContent = "Murali's Dictionary";
        document.getElementById('wordOfTheDaySection').style.display = 'none';
    } else {
        sidebar.style.display = 'none';
        toggle.textContent = '🔒';
        title.innerHTML = "The Only Dictionary<br>You Ever Need";
        document.getElementById('wordOfTheDaySection').style.display = 'block';
    }
}

function showPasswordModal() {
    if (isAdmin) {
        isAdmin = false;
        SafeStorage.setItem('isAdmin', 'false');
        checkAdminStatus();
        displayRandomWord();
    } else {
        document.getElementById('passwordModal').classList.add('show');
        document.getElementById('passwordInput').focus();
    }
}

function hidePasswordModal() {
    document.getElementById('passwordModal').classList.remove('show');
    document.getElementById('passwordInput').value = '';
}

function checkPassword() {
    const password = document.getElementById('passwordInput').value;
    if (password === ADMIN_PASSWORD) {
        isAdmin = true;
        SafeStorage.setItem('isAdmin', 'true');
        hidePasswordModal();
        checkAdminStatus();
        displayWords();
    } else {
        alert('Incorrect password!');
    }
}

// Initialize on load
document.addEventListener('DOMContentLoaded', async function() {
    // Load local data first
    const hasLocal = loadFromLocalStorage();
    
    // Check admin status
    checkAdminStatus();
    
    // Show local data immediately if available
    if (hasLocal) {
        if (isAdmin) {
            displayWords();
        } else {
            displayRandomWord();
        }
    }
    
    // Then try to sync with Supabase in background
    initializeSupabase();
});
    </script>
</body>
</html>
