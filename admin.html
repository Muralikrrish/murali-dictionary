<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Pearls of Knowledge</title>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700;800&family=Lora:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-primary: #0f1117;
            --bg-secondary: #1a1d28;
            --bg-tertiary: #232838;
            --accent-primary: #ff6b35;
            --accent-secondary: #ff8e35;
            --accent-gradient: linear-gradient(135deg, #ff6b35, #ff8e35);
            --text-primary: #f0f2fc;
            --text-secondary: #b8c0e0;
            --text-muted: #6b728c;
            --border-color: #2a3042;
            --success-color: #4caf50;
            --error-color: #f44336;
            --card-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
            --section-spacing: 60px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Google Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Login Screen Styles */
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: linear-gradient(135deg, var(--bg-secondary) 0%, var(--bg-tertiary) 100%);
            position: relative;
        }

        .login-wrapper::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 70% 20%, rgba(224, 117, 84, 0.08) 0%, transparent 60%);
            z-index: 0;
        }

        .login-container {
            background: var(--bg-secondary);
            padding: 40px;
            border-radius: 20px;
            box-shadow: var(--card-shadow);
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 400px;
            animation: slideUp 0.4s ease;
            position: relative;
            z-index: 1;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-primary);
            letter-spacing: 0.02em;
        }

        .login-header p {
            color: var(--text-muted);
            font-size: 1rem;
        }

        .lock-icon {
            font-size: 48px;
            margin-bottom: 20px;
            color: var(--accent-primary);
        }

        .login-form-group {
            margin-bottom: 20px;
        }

        .login-form-group label {
            display: block;
            color: var(--text-primary);
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .login-form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: var(--bg-primary);
            color: var(--text-primary);
        }

        .login-form-group input:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(255, 107, 53, 0.1);
        }

        .login-button {
            width: 100%;
            padding: 14px;
            background: var(--accent-gradient);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(255, 107, 53, 0.4);
        }

        .login-button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(255, 107, 53, 0.5);
        }

        .login-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .error-message {
            background: rgba(244, 67, 54, 0.1);
            color: var(--error-color);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            text-align: center;
            display: none;
            animation: shake 0.4s ease;
            border: 1px solid var(--error-color);
        }

        .error-message.show {
            display: block;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        /* Hide login when authenticated */
        body.authenticated .login-wrapper {
            display: none;
        }

        body.authenticated {
            background: var(--bg-primary);
        }

        /* Admin Content Styles */
        .admin-content {
            display: none;
        }

        .admin-content.unlocked {
            display: block;
        }

        /* Modern Section Styling */
        .modern-section {
            margin-bottom: var(--section-spacing);
            position: relative;
        }

        .modern-section-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: white;
            margin-bottom: 15px;
            position: relative;
            display: inline-block;
            padding: 3px 16px 3px 8px;
            background: var(--accent-gradient);
            clip-path: polygon(0 0, 100% 0, calc(100% - 12px) 100%, 0 100%);
            box-shadow: 0 3px 10px rgba(255, 107, 53, 0.3);
        }

        .modern-section-title .word-count {
            font-size: 0.9rem;
            opacity: 0.8;
            font-weight: 500;
            margin-left: 5px;
        }

        .interactive-card {
            background: var(--bg-secondary);
            border-radius: 20px;
            padding: 30px;
            box-shadow: var(--card-shadow);
            border: 1px solid var(--border-color);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            z-index: 1;
        }

        .interactive-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }

        /* Form Styling */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 15px;
            transition: border-color 0.3s;
            background: var(--bg-primary);
            color: var(--text-primary);
        }

        .form-group input::placeholder {
            color: var(--text-muted);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent-primary);
        }

        .editor-toolbar {
            display: flex;
            gap: 5px;
            margin-bottom: 10px;
            flex-wrap: wrap;
            padding: 10px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 6px 6px 0 0;
            align-items: center;
        }

        .editor-btn {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
            color: var(--text-primary);
        }

        .editor-btn:hover {
            background: var(--accent-primary);
            color: var(--bg-primary);
            border-color: var(--accent-primary);
        }

        .font-size-dropdown {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.2s;
        }

        .font-size-dropdown:focus {
            outline: none;
            border-color: var(--accent-primary);
        }

        /* Updated Editor Content Styles to Match index.html */
        .editor-content {
            width: 100%;
            min-height: 400px;
            max-height: 500px; /* Added max-height for scrollbar */
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 0 0 6px 6px;
            border-top: none;
            font-size: 16px;
            overflow-y: auto; /* Ensure scrollbar appears */
            background: var(--bg-primary);
            color: var(--text-secondary);
            line-height: 1.6;
            font-weight: 500;
            white-space: normal;
            word-wrap: break-word;
            word-spacing: -0.05em;
        }

        /* Custom scrollbar styling */
        .editor-content::-webkit-scrollbar {
            width: 8px;
        }

        .editor-content::-webkit-scrollbar-track {
            background: var(--bg-primary);
            border-radius: 4px;
        }

        .editor-content::-webkit-scrollbar-thumb {
            background: var(--accent-primary);
            border-radius: 4px;
        }

        .editor-content::-webkit-scrollbar-thumb:hover {
            background: var(--accent-secondary);
        }

        .editor-content:focus {
            outline: none;
        }

        .editor-content[contenteditable="true"]:empty:before {
            content: attr(placeholder);
            color: var(--text-muted);
        }

        /* Editor content styles to match index.html exactly */
        .editor-content h1 {
            font-size: 25px;
            font-weight: 700;
            color: var(--text-secondary);
            margin: 0.15em 0;
            line-height: 1.3;
        }

        .editor-content h2 {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-secondary);
            margin: 1em 0 0.15em 0;
            line-height: 1.3;
        }

        .editor-content h3 {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-secondary);
            margin: 1em 0 0.15em 0;
            line-height: 1.3;
        }

        .editor-content h4 {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-secondary);
            margin: 1em 0 0.15em 0;
            line-height: 1.3;
        }

        .editor-content h5 {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-secondary);
            margin: 1em 0 0.4em 0;
            line-height: 1.3;
        }

        .editor-content h6 {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-secondary);
            margin: 1em 0 0.4em 0;
            line-height: 1.3;
        }

        .editor-content p {
            font-size: 16px;
            margin: 0.75em 0;
            line-height: 1.6;
            color: var(--text-secondary);
        }

        .editor-content ul, .editor-content ol {
            margin: 0.5em 0;
            padding-left: 1.2em;
        }

        .editor-content li {
            margin: 0.25em 0;
            line-height: 1.45;
            color: var(--text-secondary);
        }

        .editor-content strong, .editor-content b {
            font-weight: 700;
            color: var(--text-secondary);
        }

        .editor-content em, .editor-content i {
            font-style: italic;
        }

        .editor-content u {
            text-decoration: underline;
        }

        .btn {
            background: var(--accent-gradient);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            box-shadow: 0 4px 12px rgba(255, 107, 53, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(255, 107, 53, 0.4);
        }

        .btn-secondary {
            background: var(--bg-secondary);
            color: var(--accent-primary);
            border: 2px solid var(--accent-primary);
            margin-top: 10px;
        }

        .info-box {
            background: var(--bg-tertiary);
            padding: 20px;
            border-radius: 6px;
            margin-top: 20px;
            font-size: 14px;
            color: var(--text-muted);
            border-left: 3px solid var(--accent-primary);
            animation: fadeIn 0.6s ease;
        }

        .success-box {
            background: rgba(76, 175, 80, 0.1);
            padding: 20px;
            border-radius: 6px;
            margin-top: 20px;
            font-size: 14px;
            color: var(--success-color);
            border-left: 3px solid var(--success-color);
            animation: fadeIn 0.6s ease;
            box-shadow: 0 2px 8px rgba(76, 175, 80, 0.2);
        }

        .edit-result-item, .quick-add-result-item {
            background: var(--bg-tertiary);
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: all 0.3s;
        }

        .edit-result-item:hover, .quick-add-result-item:hover {
            background: var(--bg-secondary);
            border-color: var(--accent-primary);
            transform: translateY(-2px);
        }

        .edit-result-word, .quick-add-result-word {
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 5px;
            font-size: 16px;
        }

        #editSearchResults, #quickAddSearchResults {
            max-height: 300px;
            overflow-y: auto;
            margin-top: 10px;
        }

        #quickAddList {
            max-height: 300px;
            overflow-y: auto;
            margin-top: 15px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 10px;
            min-height: 60px;
        }

        .quick-add-item {
            background: var(--bg-secondary);
            padding: 12px 15px;
            margin-bottom: 8px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .quick-add-word {
            color: var(--text-primary);
            font-weight: 600;
            font-size: 15px;
            word-break: break-word;
            flex: 1;
        }

        .quick-add-remove {
            background: var(--error-color);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .quick-add-remove:hover {
            background: #d32f2f;
            transform: translateY(-1px);
        }

        .quick-add-warning {
            color: var(--warning-color);
            font-size: 13px;
            margin-top: 5px;
            display: none;
        }

        .quick-add-empty {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            font-size: 14px;
        }

        .quick-add-controls {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .quick-add-btn {
            background: var(--accent-primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 14px;
            fontWeight: 600;
            cursor: pointer;
            transition: all 0.3s;
            flex: 1;
        }

        .quick-add-btn:hover {
            background: var(--accent-secondary);
            transform: translateY(-2px);
        }

        .quick-add-refresh {
            background: var(--bg-secondary);
            color: var(--accent-primary);
            border: 2px solid var(--accent-primary);
        }

        .quick-add-refresh:hover {
            background: var(--accent-primary);
            color: white;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .login-container {
                padding: 30px 20px;
            }
            
            .login-header h1 {
                font-size: 2rem;
            }
            
            .interactive-card {
                padding: 20px;
            }
            
            .modern-section-title {
                font-size: 1.1rem;
            }

            .editor-content h1 { font-size: 25px; }
            .editor-content h2 { font-size: 22px; }
            .editor-content h3 { font-size: 20px; }
            .editor-content h4 { font-size: 18px; }
            .editor-content h5 { font-size: 16px; }
            .editor-content h6 { font-size: 14px; }
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 25px 15px;
            }
            
            .login-header h1 {
                font-size: 1.8rem;
            }
            
            .interactive-card {
                padding: 20px 15px;
            }
            
            .container {
                padding: 0 15px;
            }
            
            .modern-section {
                margin-bottom: 40px;
            }
        }

        .main-content {
            padding: 40px 0 60px;
        }

        @media (min-width: 768px) {
            .main-content {
                display: grid;
                grid-template-columns: 1fr;
                gap: 32px;
                align-items: start;
            }

            .editor-content { 
                font-size: 1.3rem; 
                line-height: 1.6; 
            }
            .editor-content h1 { font-size: 2.2rem; margin: 0.2em 0; }
            .editor-content h2 { font-size: 1.9rem; margin: 1.2em 0 0.2em 0; }
            .editor-content h3 { font-size: 1.7rem; margin: 1.2em 0 0.2em 0; }
            .editor-content h4 { font-size: 1.5rem; margin: 1.2em 0 0.2em 0; }
            .editor-content h5 { font-size: 1.3rem; margin: 1.2em 0 0.4em 0; }
            .editor-content h6 { font-size: 1.2rem; margin: 1.2em 0 0.4em 0; }
        }
    </style>
</head>
<body>
    <!-- Login Screen -->
    <div class="login-wrapper">
        <div class="login-container">
            <div class="login-header">
                <div class="lock-icon">🔒</div>
                <h1>Admin Access</h1>
                <p>Enter password to continue</p>
            </div>
            
            <div class="error-message" id="errorMessage">
                Incorrect password. Please try again.
            </div>
            
            <form id="loginForm" onsubmit="return false;">
                <div class="login-form-group">
                    <label for="password">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                </div>
                
                <button type="submit" class="login-button" id="loginButton" onclick="checkPassword()">
                    <span id="loginButtonText">Login</span>
                </button>
            </form>
        </div>
    </div>

    <!-- Admin Content -->
    <div class="admin-content" id="adminContent">
        <div class="container">
            <div class="main-content" id="mainContent">
                <div class="modern-section">
                    <h2 class="modern-section-title">Add New Word <span class="word-count" id="dictionaryCount">(0)</span></h2>
                    <div class="interactive-card">
                        <form id="addWordForm">
                            <div class="form-group">
                                <label for="wordInput">Word</label>
                                <input type="text" id="wordInput" required placeholder="Enter word" oninput="updateDefinitionHeader(); checkExistingWord()" onkeyup="autoLowerCase(this)" onpaste="handlePaste(event)">
                                <div id="wordWarning" style="color:#f39c12;font-size:13px;margin-top:5px;display:none">⚠️ This word already exists</div>
                            </div>
                            <div class="form-group">
                                <label for="definitionInput">Definition</label>
                                <div class="editor-toolbar">
                                    <select class="font-size-dropdown" id="formatDropdown" onchange="formatHeading(this.value)">
                                        <option value="">Normal</option>
                                        <option value="h1">Heading 1</option>
                                        <option value="h2">Heading 2</option>
                                        <option value="h3">Heading 3</option>
                                        <option value="h4">Heading 4</option>
                                    </select>
                                    <button type="button" class="editor-btn" onclick="formatText('bold')"><b>B</b></button>
                                    <button type="button" class="editor-btn" onclick="formatText('italic')"><i>I</i></button>
                                    <button type="button" class="editor-btn" onclick="formatText('underline')"><u>U</u></button>
                                    <button type="button" class="editor-btn" onclick="formatText('insertOrderedList')">1.2.3.</button>
                                    <button type="button" class="editor-btn" onclick="formatText('insertUnorderedList')">• • •</button>
                                    <button type="button" class="editor-btn" onclick="formatText('removeFormat')">✗</button>
                                </div>
                                <div id="definitionInput" class="editor-content" contenteditable="true" placeholder="Enter definition..."></div>
                            </div>
                            <button type="submit" class="btn">Add to Dictionary</button>
                        </form>
                    </div>
                </div>

                <div class="modern-section">
                    <h2 class="modern-section-title">Quick Add <span id="quickAddCount">(0)</span></h2>
                    <div class="interactive-card">
                        <div class="form-group">
                            <label for="quickAddSearch">Search Word</label>
                            <input type="text" id="quickAddSearch" placeholder="Type a word..." oninput="searchWordsForQuickAdd()">
                            <div id="quickAddWarning" class="quick-add-warning">⚠️ Word exists</div>
                        </div>
                        <div class="quick-add-controls">
                            <button class="quick-add-btn" onclick="addToQuickList()">Add to List</button>
                            <button class="quick-add-btn quick-add-refresh" onclick="refreshQuickList()">Refresh</button>
                        </div>
                        <div id="quickAddSearchResults"></div>
                        <div id="quickAddList"><div class="quick-add-empty">No words yet</div></div>
                    </div>
                </div>

                <div class="modern-section">
                    <h2 class="modern-section-title">Edit Word</h2>
                    <div class="interactive-card">
                        <div class="form-group">
                            <label for="editSearchInput">Search</label>
                            <input type="text" id="editSearchInput" placeholder="Type to search..." oninput="searchWordsToEdit()">
                        </div>
                        <div id="editSearchResults"></div>
                    </div>
                </div>

                <div class="modern-section">
                    <h2 class="modern-section-title">Utilities</h2>
                    <div class="interactive-card">
                        <div class="utility-buttons">
                            <button class="btn" onclick="exportData()">Export Dictionary</button>
                            <button class="btn btn-secondary" onclick="document.getElementById('importFile').click()" style="margin-top: 15px;">Import Dictionary</button>
                            <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
                        </div>
                        <div id="syncStatus" class="success-box"><strong>✓ Supabase Connected!</strong> Dictionary syncing across devices.</div>
                        <div class="info-box"><strong>💡 Tip:</strong> Auto-saves to cloud!</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Supabase Configuration
        const SUPABASE_URL = 'https://jlzzxruwxyzswzgppkgq.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impsenp4cnV3eHl6c3d6Z3Bwa2dxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjE5MjEyNDksImV4cCI6MjA3NzQ5NzI0OX0.fgL70q1wRSWH4OOn3x_Gh76EZA0JIxGJsWfMTPpSBZM';

        let supabaseClient;
        const SESSION_DURATION = 24 * 60 * 60 * 1000;
        const CORRECT_PASSWORD = "murali";
        let dictionary = [], quickAddList = [], editingWordId = null, searchIndex = null;
        let isSupabaseConfigured = false, supabaseInitialized = false;

        // Safe Storage
        const SafeStorage = {
            isAvailable: false,
            memoryStorage: {},
            init() {
                try {
                    const test = '__test__';
                    localStorage.setItem(test, test);
                    localStorage.removeItem(test);
                    this.isAvailable = true;
                } catch(e) {
                    console.warn('localStorage unavailable');
                }
            },
            setItem(key, value) {
                try {
                    if (this.isAvailable) localStorage.setItem(key, value);
                    this.memoryStorage[key] = value;
                } catch(e) {
                    this.memoryStorage[key] = value;
                }
            },
            getItem(key) {
                try {
                    if (this.isAvailable) {
                        const value = localStorage.getItem(key);
                        if (value !== null) return value;
                    }
                    return this.memoryStorage[key] || null;
                } catch(e) {
                    return this.memoryStorage[key] || null;
                }
            }
        };
        SafeStorage.init();

        // Password Authentication
        function checkPassword() {
            const passwordInput = document.getElementById('password');
            const password = passwordInput.value;

            if (!password) {
                showError('Please enter a password');
                return;
            }

            if (password === CORRECT_PASSWORD) {
                const session = {
                    authenticated: true,
                    expires: Date.now() + SESSION_DURATION
                };
                sessionStorage.setItem('adminSession', JSON.stringify(session));
                unlockAdmin();
            } else {
                showError('Incorrect password. Please try again.');
                passwordInput.value = '';
                passwordInput.focus();
            }
        }

        function showError(message) {
            const errorMessage = document.getElementById('errorMessage');
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
            setTimeout(() => errorMessage.classList.remove('show'), 3000);
        }

        function checkAuth() {
            const session = JSON.parse(sessionStorage.getItem('adminSession') || 'null');
            if (session && Date.now() < session.expires) {
                unlockAdmin();
                return true;
            }
            return false;
        }

        function unlockAdmin() {
            document.body.classList.add('authenticated');
            document.getElementById('adminContent').classList.add('unlocked');
            initializeAdmin();
        }

        // NEW: Auto lowercase functions for word input
        function autoLowerCase(input) {
            input.value = input.value.toLowerCase();
        }

        function handlePaste(event) {
            // Allow the paste to happen first
            setTimeout(() => {
                const input = event.target;
                input.value = input.value.toLowerCase();
                updateDefinitionHeader(); // Update the definition header after paste
                checkExistingWord(); // Check if word exists after paste
            }, 0);
        }

        // NEW: Update definition header with word in h1 style
        function updateDefinitionHeader() {
            const wordInput = document.getElementById('wordInput');
            const editor = document.getElementById('definitionInput');
            let word = wordInput.value.trim();
            
            if (!word) {
                return;
            }

            // Capitalize first letter
            let capitalizedWord = word.charAt(0).toUpperCase() + word.slice(1);
            
            // Check if the editor's first child is an h1
            let firstChild = editor.firstChild;
            if (firstChild && firstChild.nodeType === Node.ELEMENT_NODE && firstChild.tagName === 'H1') {
                // Update the existing h1
                firstChild.textContent = capitalizedWord;
            } else {
                // Create a new h1 and insert it at the beginning
                let h1 = document.createElement('h1');
                h1.textContent = capitalizedWord;
                editor.insertBefore(h1, editor.firstChild);
            }
        }

        // NEW: Function to convert markdown-style headings to HTML when pasting
        function processMarkdownHeadings(text) {
            // Split the text into lines
            const lines = text.split('\n');
            let html = '';
            
            for (let line of lines) {
                // Trim the line to remove extra whitespace
                const trimmedLine = line.trim();
                
                // Check for markdown-style headings
                if (trimmedLine.startsWith('# ')) {
                    // H1: Remove the '# ' and wrap in h1 tags
                    html += `<h1>${trimmedLine.substring(2)}</h1>`;
                } else if (trimmedLine.startsWith('## ')) {
                    // H2: Remove the '## ' and wrap in h2 tags
                    html += `<h2>${trimmedLine.substring(3)}</h2>`;
                } else if (trimmedLine.startsWith('### ')) {
                    // H3: Remove the '### ' and wrap in h3 tags
                    html += `<h3>${trimmedLine.substring(4)}</h3>`;
                } else if (trimmedLine.startsWith('#### ')) {
                    // H4: Remove the '#### ' and wrap in h4 tags
                    html += `<h4>${trimmedLine.substring(5)}</h4>`;
                } else if (trimmedLine.startsWith('##### ')) {
                    // H5: Remove the '##### ' and wrap in h5 tags
                    html += `<h5>${trimmedLine.substring(6)}</h5>`;
                } else if (trimmedLine.startsWith('###### ')) {
                    // H6: Remove the '###### ' and wrap in h6 tags
                    html += `<h6>${trimmedLine.substring(7)}</h6>`;
                } else if (trimmedLine === '') {
                    // Empty line - add a paragraph break
                    html += '<p><br></p>';
                } else {
                    // Regular text - wrap in paragraph tags
                    html += `<p>${trimmedLine}</p>`;
                }
            }
            
            return html;
        }

        // Dictionary Management Functions
        function buildSearchIndex() {
            searchIndex = dictionary.map(item => ({
                id: item.id,
                word: item.word,
                wordLower: item.word.toLowerCase(),
                definition: item.definition,
                definitionText: item.definition.replace(/<[^>]*>/g,'').toLowerCase()
            }));
        }

        function updateWordCount() {
            document.getElementById('dictionaryCount').textContent = `(${dictionary.length})`;
        }

        function loadFromLocalStorage() {
            const localDict = SafeStorage.getItem('dictionary');
            dictionary = localDict ? JSON.parse(localDict) : [];
            buildSearchIndex();
            updateWordCount();
            
            const localQuickAdd = SafeStorage.getItem('quickAddList');
            quickAddList = localQuickAdd ? JSON.parse(localQuickAdd) : [];
            
            return dictionary.length > 0;
        }

        async function initializeSupabase() {
            try {
                const { createClient } = supabase;
                supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                
                // Test the connection
                const { data, error } = await supabaseClient
                    .from('dictionary')
                    .select('id')
                    .limit(1);
                
                if (error) throw error;
                
                isSupabaseConfigured = supabaseInitialized = true;
                document.getElementById('syncStatus').innerHTML = '<strong>✓ Supabase Connected!</strong> Dictionary syncing across devices.';
                await syncWithSupabase();
            } catch(error) {
                console.error('Supabase init error:', error);
                document.getElementById('syncStatus').innerHTML = `<strong>⚠ Supabase Connection Failed:</strong> ${error.message}`;
                document.getElementById('syncStatus').style.background = 'rgba(244, 67, 54, 0.1)';
                document.getElementById('syncStatus').style.borderLeftColor = 'var(--error-color)';
                document.getElementById('syncStatus').style.color = 'var(--error-color)';
            }
        }

        async function syncWithSupabase() {
            if (!isSupabaseConfigured || !supabaseInitialized) return;
            
            try {
                const { data, error } = await supabaseClient
                    .from('dictionary')
                    .select('*')
                    .order('word', { ascending: true });
                
                if (error) throw error;
                
                if (data && data.length > 0) {
                    dictionary = data.map(item => ({
                        id: item.id,
                        word: item.word,
                        definition: item.definition,
                        dateAdded: item.date_added,
                        dateModified: item.date_modified
                    }));
                    
                    buildSearchIndex();
                    updateWordCount();
                    SafeStorage.setItem('dictionary', JSON.stringify(dictionary));
                }
            } catch(error) {
                console.error('Sync error:', error);
            }
        }

        async function saveDictionary() {
            SafeStorage.setItem('dictionary', JSON.stringify(dictionary));
            updateWordCount();
            
            if (isSupabaseConfigured && supabaseInitialized) {
                try {
                    // Get the latest word (assuming it's the last one in the array)
                    const latestWord = dictionary[dictionary.length - 1];
                    
                    const { error } = await supabaseClient
                        .from('dictionary')
                        .upsert([{
                            id: latestWord.id,
                            word: latestWord.word,
                            definition: latestWord.definition,
                            date_added: latestWord.dateAdded,
                            date_modified: latestWord.dateModified
                        }], {
                            onConflict: 'id'
                        });
                    
                    if (error) throw error;
                    
                    console.log('Successfully saved to Supabase:', latestWord);
                } catch(error) {
                    console.error('Save error:', error);
                    alert('Failed to save to cloud: ' + error.message);
                }
            }
        }

        async function updateWordInSupabase(word) {
            if (!isSupabaseConfigured || !supabaseInitialized) return;
            
            try {
                const { error } = await supabaseClient
                    .from('dictionary')
                    .update({
                        word: word.word,
                        definition: word.definition,
                        date_modified: word.dateModified
                    })
                    .eq('id', word.id);
                
                if (error) throw error;
                
                console.log('Successfully updated in Supabase:', word);
            } catch(error) {
                console.error('Update error:', error);
                alert('Failed to update word in cloud: ' + error.message);
            }
        }

        function checkExistingWord() {
            const wordInput = document.getElementById('wordInput');
            const warning = document.getElementById('wordWarning');
            const word = wordInput.value.trim().toLowerCase();
            
            if (!word) {
                warning.style.display = 'none';
                return;
            }
            
            const exists = dictionary.some(item => item.word.toLowerCase() === word);
            warning.style.display = exists ? 'block' : 'none';
        }

        // Fixed Text Formatting Functions
        function formatText(command, value = null) {
            document.execCommand(command, false, value);
            document.getElementById('definitionInput').focus();
            updateFormatDropdown();
        }

        function formatHeading(tag) {
            if (tag) {
                document.execCommand('formatBlock', false, `<${tag}>`);
            } else {
                document.execCommand('formatBlock', false, '<p>');
            }
            document.getElementById('definitionInput').focus();
            updateFormatDropdown();
        }

        function updateFormatDropdown() {
            const editor = document.getElementById('definitionInput');
            const dropdown = document.getElementById('formatDropdown');
            
            try {
                const selection = window.getSelection();
                if (selection.rangeCount > 0) {
                    const parentElement = selection.getRangeAt(0).startContainer.parentElement;
                    const tagName = parentElement.tagName.toLowerCase();
                    
                    if (['h1', 'h2', 'h3', 'h4'].includes(tagName)) {
                        dropdown.value = tagName;
                    } else {
                        dropdown.value = '';
                    }
                }
            } catch (e) {
                console.log('Could not update format dropdown');
            }
        }

        // Handle paste events to preserve formatting and line breaks
        document.addEventListener('DOMContentLoaded', function() {
            const editor = document.getElementById('definitionInput');
            if (editor) {
                editor.addEventListener('paste', function(e) {
                    e.preventDefault();
                    
                    // Get pasted text with formatting preserved
                    const html = (e.clipboardData || window.clipboardData).getData('text/html');
                    const text = (e.clipboardData || window.clipboardData).getData('text/plain');
                    
                    // Check if the content contains markdown-style headings
                    if (text && (text.includes('# ') || text.includes('## ') || text.includes('### ') || text.includes('#### '))) {
                        // Process markdown headings
                        const processedHtml = processMarkdownHeadings(text);
                        document.execCommand('insertHTML', false, processedHtml);
                    } else if (html) {
                        // Insert HTML content directly to preserve formatting and line breaks
                        document.execCommand('insertHTML', false, html);
                    } else {
                        // Fallback to plain text with line breaks preserved
                        const withLineBreaks = text.replace(/\n/g, '<br>');
                        document.execCommand('insertHTML', false, withLineBreaks);
                    }
                });
                
                // Update format dropdown when selection changes
                editor.addEventListener('input', updateFormatDropdown);
                editor.addEventListener('click', updateFormatDropdown);
                editor.addEventListener('keyup', updateFormatDropdown);
            }
        });

        document.getElementById('addWordForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const wordInput = document.getElementById('wordInput');
            const definitionInput = document.getElementById('definitionInput');
            
            const word = wordInput.value.trim().toLowerCase(); // Ensure lowercase on submit
            let definition = definitionInput.innerHTML.trim();
            
            if (!word || !definition) {
                alert('Please fill in all fields');
                return;
            }
            
            let successMessage = '';
            
            if (editingWordId !== null) {
                // Update existing word
                const index = dictionary.findIndex(item => item.id === editingWordId);
                if (index !== -1) {
                    dictionary[index].word = word;
                    dictionary[index].definition = definition;
                    dictionary[index].dateModified = new Date().toISOString();
                    
                    // Update in Supabase
                    if (isSupabaseConfigured && supabaseInitialized) {
                        await updateWordInSupabase(dictionary[index]);
                    }
                }
                editingWordId = null;
                successMessage = 'Word updated successfully!';
            } else {
                // Add new word
                const newWord = {
                    id: Date.now(),
                    word: word,
                    definition: definition,
                    dateAdded: new Date().toISOString(),
                    dateModified: new Date().toISOString()
                };
                dictionary.push(newWord);
                
                // Save to local storage and Supabase
                await saveDictionary();
                successMessage = 'Word added successfully!';
            }
            
            // Sort dictionary and update
            dictionary.sort((a, b) => a.word.localeCompare(b.word));
            buildSearchIndex();
            SafeStorage.setItem('dictionary', JSON.stringify(dictionary));
            updateWordCount();
            
            // Clear form
            wordInput.value = '';
            definitionInput.innerHTML = '';
            document.getElementById('wordWarning').style.display = 'none';
            
            // Success message removed - no popup confirmation
        });

        function editWord(id) {
            const word = dictionary.find(item => item.id === id);
            if (!word) return;
            
            editingWordId = id;
            document.getElementById('wordInput').value = word.word;
            document.getElementById('definitionInput').innerHTML = word.definition;
            document.getElementById('editSearchInput').value = '';
            document.getElementById('editSearchResults').innerHTML = '';
            
            // Scroll to the top
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function deleteWord(id) {
            if (!confirm('Are you sure you want to delete this word?')) return;
            
            const wordIndex = dictionary.findIndex(item => item.id === id);
            if (wordIndex === -1) return;
            
            // Delete from Supabase first
            if (isSupabaseConfigured && supabaseInitialized) {
                try {
                    const { error } = await supabaseClient
                        .from('dictionary')
                        .delete()
                        .eq('id', id);
                    
                    if (error) throw error;
                } catch(error) {
                    console.error('Delete error:', error);
                    alert('Failed to delete word from cloud: ' + error.message);
                    return;
                }
            }
            
            // Delete from local dictionary
            dictionary.splice(wordIndex, 1);
            buildSearchIndex();
            SafeStorage.setItem('dictionary', JSON.stringify(dictionary));
            updateWordCount();
            
            alert('Word deleted successfully!');
        }

        function searchWordsToEdit() {
            const query = document.getElementById('editSearchInput').value.trim().toLowerCase();
            const resultsDiv = document.getElementById('editSearchResults');
            
            if (!query) {
                resultsDiv.innerHTML = '';
                return;
            }
            
            const matches = dictionary.filter(item => 
                item.word.toLowerCase().includes(query)
            ).slice(0, 5);
            
            if (matches.length === 0) {
                resultsDiv.innerHTML = '<div class="no-results">No matches found</div>';
                return;
            }
            
            let html = '';
            matches.forEach(item => {
                const preview = item.definition.replace(/<[^>]*>/g, '').substring(0, 100) + '...';
                html += `
                    <div class="edit-result-item">
                        <div class="edit-result-word">${item.word}</div>
                        <div class="edit-result-definition">${preview}</div>
                        <div style="margin-top: 10px; display: flex; gap: 10px;">
                            <button class="editor-btn" onclick="editWord(${item.id})" style="font-size: 12px; padding: 5px 10px;">Edit</button>
                            <button class="editor-btn" onclick="deleteWord(${item.id})" style="font-size: 12px; padding: 5px 10px; background: var(--error-color);">Delete</button>
                        </div>
                    </div>
                `;
            });
            resultsDiv.innerHTML = html;
        }

        function searchWordsForQuickAdd() {
            const query = document.getElementById('quickAddSearch').value.trim().toLowerCase();
            const resultsDiv = document.getElementById('quickAddSearchResults');
            const warning = document.getElementById('quickAddWarning');
            
            warning.style.display = 'none';
            
            if (!query) {
                resultsDiv.innerHTML = '';
                return;
            }
            
            const exists = dictionary.some(item => item.word.toLowerCase() === query);
            if (exists) {
                warning.style.display = 'block';
            }
        }

        function addToQuickList() {
            const input = document.getElementById('quickAddSearch');
            const word = input.value.trim().toLowerCase(); // Ensure lowercase
            
            if (!word) return;
            
            const exists = dictionary.some(item => item.word.toLowerCase() === word.toLowerCase());
            if (exists) {
                alert('This word already exists in the dictionary');
                return;
            }
            
            const inList = quickAddList.some(item => item.toLowerCase() === word.toLowerCase());
            if (inList) {
                alert('This word is already in the quick list');
                return;
            }
            
            quickAddList.push(word);
            SafeStorage.setItem('quickAddList', JSON.stringify(quickAddList));
            displayQuickAddList();
            input.value = '';
            document.getElementById('quickAddWarning').style.display = 'none';
        }

        function displayQuickAddList() {
            const listDiv = document.getElementById('quickAddList');
            const countSpan = document.getElementById('quickAddCount');
            
            countSpan.textContent = `(${quickAddList.length})`;
            
            if (quickAddList.length === 0) {
                listDiv.innerHTML = '<div class="quick-add-empty">No words yet</div>';
                return;
            }
            
            let html = '';
            quickAddList.forEach((word, index) => {
                html += `
                    <div class="quick-add-item">
                        <div class="quick-add-word">${word}</div>
                        <button class="quick-add-remove" onclick="removeFromQuickList(${index})">Remove</button>
                    </div>
                `;
            });
            listDiv.innerHTML = html;
        }

        function removeFromQuickList(index) {
            quickAddList.splice(index, 1);
            SafeStorage.setItem('quickAddList', JSON.stringify(quickAddList));
            displayQuickAddList();
        }

        function refreshQuickList() {
            quickAddList = quickAddList.filter(word => 
                !dictionary.some(item => item.word.toLowerCase() === word.toLowerCase())
            );
            SafeStorage.setItem('quickAddList', JSON.stringify(quickAddList));
            displayQuickAddList();
        }

        function exportData() {
            const dataStr = JSON.stringify(dictionary, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `dictionary_${new Date().toISOString().split('T')[0]}.json`;
            link.click();
            URL.revokeObjectURL(url);
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (!Array.isArray(imported)) {
                        alert('Invalid file format');
                        return;
                    }
                    
                    dictionary = imported;
                    buildSearchIndex();
                    
                    // Save to Supabase
                    if (isSupabaseConfigured && supabaseInitialized) {
                        try {
                            // Clear existing data
                            const { error: deleteError } = await supabaseClient
                                .from('dictionary')
                                .delete()
                                .neq('id', 0); // Delete all records
                            
                            if (deleteError) throw deleteError;
                            
                            // Insert imported data
                            const supabaseData = dictionary.map(item => ({
                                id: item.id,
                                word: item.word,
                                definition: item.definition,
                                date_added: item.dateAdded,
                                date_modified: item.dateModified
                            }));
                            
                            const { error: insertError } = await supabaseClient
                                .from('dictionary')
                                .insert(supabaseData);
                            
                            if (insertError) throw insertError;
                        } catch(error) {
                            console.error('Supabase import error:', error);
                            alert('Error importing to cloud: ' + error.message);
                        }
                    }
                    
                    SafeStorage.setItem('dictionary', JSON.stringify(dictionary));
                    updateWordCount();
                    alert('Dictionary imported successfully!');
                } catch (error) {
                    alert('Error importing file: ' + error.message);
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        function initializeAdmin() {
            loadFromLocalStorage();
            displayQuickAddList();
            initializeSupabase();
        }

        // Check authentication on page load
        if (checkAuth()) {
            // Already authenticated
        }

        document.getElementById('password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') checkPassword();
        });
    </script>
