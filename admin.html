<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dictionary Admin - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
            animation: slideUp 0.4s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .login-header p {
            color: #666;
            font-size: 14px;
        }

        .lock-icon {
            font-size: 48px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .login-button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .login-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        .login-button:active {
            transform: translateY(0);
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            text-align: center;
            display: none;
            animation: shake 0.4s ease;
        }

        .error-message.show {
            display: block;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .admin-content {
            display: none;
        }

        .admin-content.unlocked {
            display: block;
        }

        /* Hide login when authenticated */
        body.authenticated .login-container {
            display: none;
        }

        body.authenticated {
            background: #f5f5f5;
        }

        .logout-button {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            background: #f44336;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .logout-button:hover {
            background: #d32f2f;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <!-- Login Screen -->
    <div class="login-container">
        <div class="login-header">
            <div class="lock-icon">🔒</div>
            <h1>Admin Access</h1>
            <p>Enter password to continue</p>
        </div>
        
        <div class="error-message" id="errorMessage">
            Incorrect password. Please try again.
        </div>
        
        <form id="loginForm" onsubmit="return false;">
            <div class="form-group">
                <label for="password">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >
            </div>
            
            <button type="submit" class="login-button" onclick="checkPassword()">
                Login
            </button>
        </form>
    </div>

    <!-- Admin Content (Your existing admin.html content goes here) -->
    <div class="admin-content" id="adminContent">
        <button class="logout-button" onclick="logout()">Logout</button>
        
        <!-- 
        PASTE YOUR ENTIRE ADMIN.HTML CONTENT HERE 
        Everything from your current admin.html should go inside this div
        -->
        <div style="padding: 20px; max-width: 1200px; margin: 0 auto;">
            <h1 style="margin-bottom: 20px;">Dictionary Admin Panel</h1>
            <p>Admin content will be displayed here after successful login.</p>
            <p><strong>Instructions:</strong> Replace this section with your complete admin.html content.</p>
        </div>
    </div>

    <script>
        // Password Configuration
        // Change this to your desired password hash
        // To generate a new hash, open browser console and run: 
        // await crypto.subtle.digest('SHA-256', new TextEncoder().encode('YourPasswordHere')).then(h => Array.from(new Uint8Array(h)).map(b => b.toString(16).padStart(2, '0')).join(''))
        
        // Default password is: "admin123"
        // You should change this!
        const PASSWORD_HASH = '240be518fabd2724ddb6f04eeb1da5967448d7e831c08c8fa822809f74c720a9';

        // Session duration (24 hours in milliseconds)
        const SESSION_DURATION = 24 * 60 * 60 * 1000;

        // Check if already authenticated
        function checkAuth() {
            const session = JSON.parse(sessionStorage.getItem('adminSession') || 'null');
            if (session && Date.now() < session.expires) {
                unlockAdmin();
                return true;
            }
            return false;
        }

        // Hash password using SHA-256
        async function hashPassword(password) {
            const msgBuffer = new TextEncoder().encode(password);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // Check password
        async function checkPassword() {
            const passwordInput = document.getElementById('password');
            const password = passwordInput.value;
            const errorMessage = document.getElementById('errorMessage');

            if (!password) {
                errorMessage.textContent = 'Please enter a password';
                errorMessage.classList.add('show');
                return;
            }

            const hash = await hashPassword(password);

            if (hash === PASSWORD_HASH) {
                // Correct password
                const session = {
                    authenticated: true,
                    expires: Date.now() + SESSION_DURATION
                };
                sessionStorage.setItem('adminSession', JSON.stringify(session));
                unlockAdmin();
            } else {
                // Wrong password
                errorMessage.textContent = 'Incorrect password. Please try again.';
                errorMessage.classList.add('show');
                passwordInput.value = '';
                passwordInput.focus();
                
                setTimeout(() => {
                    errorMessage.classList.remove('show');
                }, 3000);
            }
        }

        // Unlock admin panel
        function unlockAdmin() {
            document.body.classList.add('authenticated');
            document.getElementById('adminContent').classList.add('unlocked');
        }

        // Logout
        function logout() {
            sessionStorage.removeItem('adminSession');
            location.reload();
        }

        // Enter key support
        document.getElementById('password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                checkPassword();
            }
        });

        // Check authentication on page load
        checkAuth();

        // Generate new password hash (for admin use)
        // Uncomment and run in console to generate new password hash:
        /*
        async function generatePasswordHash(password) {
            const hash = await hashPassword(password);
            console.log('Password:', password);
            console.log('Hash:', hash);
            console.log('Copy this hash to PASSWORD_HASH variable');
            return hash;
        }
        // Usage: generatePasswordHash('YourNewPassword')
        */
    </script>
</body>
</html>
