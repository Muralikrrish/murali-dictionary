<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Pearls of Knowledge</title>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700;800&family=Lora:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-primary: #0f1117;
            --bg-secondary: #1a1d28;
            --bg-tertiary: #232838;
            --accent-primary: #ff6b35;
            --accent-secondary: #ff8e35;
            --accent-gradient: linear-gradient(135deg, #ff6b35, #ff8e35);
            --text-primary: #f0f2fc;
            --text-secondary: #b8c0e0;
            --text-muted: #6b728c;
            --border-color: #2a3042;
            --success-color: #4caf50;
            --error-color: #f44336;
            --card-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
            --section-spacing: 60px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Google Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .admin-header {
            background: linear-gradient(135deg, #1a1d28 0%, #232838 100%);
            padding: 40px 0;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
        }

        .admin-title {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 16px;
            color: #a8b4d4;
        }

        .admin-subtitle {
            font-family: 'Lora', serif;
            font-size: 1.2rem;
            color: #8892b0;
            font-style: italic;
        }

        .main-content {
            padding: 40px 0;
        }

        .modern-section {
            margin-bottom: var(--section-spacing);
        }

        .modern-section-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: white;
            margin-bottom: 20px;
            position: relative;
            display: inline-block;
            padding: 3px 16px 3px 8px;
            background: linear-gradient(135deg, #d15a3f, #e07554);
            clip-path: polygon(0 0, 100% 0, calc(100% - 12px) 100%, 0 100%);
            box-shadow: 0 3px 10px rgba(209, 90, 63, 0.3);
            text-transform: none;
        }

        .interactive-card {
            background: var(--bg-secondary);
            border-radius: 20px;
            padding: 30px;
            box-shadow: var(--card-shadow);
            border: 1px solid var(--border-color);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            margin-bottom: 20px;
        }

        .interactive-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .form-input, .form-textarea, .form-select {
            width: 100%;
            padding: 15px 20px;
            background: var(--bg-tertiary);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-input:focus, .form-textarea:focus, .form-select:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(255, 107, 53, 0.2);
        }

        .form-textarea {
            min-height: 150px;
            resize: vertical;
        }

        .btn {
            padding: 14px 28px;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #d15a3f, #e07554);
            color: white;
            box-shadow: 0 6px 20px rgba(209, 90, 63, 0.4);
        }

        .btn-primary:hover {
            box-shadow: 0 8px 25px rgba(209, 90, 63, 0.5);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--accent-primary);
            box-shadow: 0 6px 20px rgba(255, 107, 53, 0.4);
        }

        .btn-secondary:hover {
            box-shadow: 0 8px 24px rgba(255, 107, 53, 0.5);
            transform: translateY(-2px);
        }

        .word-definition-preview {
            position: relative;
            max-height: 500px;
            overflow: hidden;
            transition: max-height 0.4s ease-in-out;
        }

        .word-definition-preview.expanded {
            max-height: none;
        }

        .definition-fade {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 80px;
            background: linear-gradient(transparent, var(--bg-secondary));
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .word-definition-preview.expanded .definition-fade {
            opacity: 0;
        }

        .read-more-container {
            display: flex;
            justify-content: center;
            margin-top: 20px;
            width: 100%;
        }

        .read-more-btn {
            background: linear-gradient(135deg, #d15a3f, #e07554);
            color: white;
            border: 2px solid transparent;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(209, 90, 63, 0.3);
            text-align: center;
            justify-content: center;
            width: auto;
            min-width: 140px;
        }

        .read-more-btn:hover {
            background: linear-gradient(135deg, #b84a30, #d15a3f);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(209, 90, 63, 0.5);
        }

        .words-list {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        .word-entry {
            padding: 20px;
            background: var(--bg-tertiary);
            border-radius: 12px;
            border-left: 4px solid var(--accent-primary);
        }

        .word-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 12px;
        }

        .word-definition {
            font-size: 1rem;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .word-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-small {
            padding: 8px 16px;
            font-size: 0.9rem;
        }

        .btn-danger {
            background: var(--error-color);
            color: white;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .stat-item {
            text-align: center;
            padding: 20px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
        }

        .stat-item:hover {
            background: rgba(255, 255, 255, 0.05);
            transform: translateY(-3px);
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--accent-primary);
            margin-bottom: 8px;
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .alert {
            padding: 15px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: none;
        }

        .alert-success {
            background: rgba(76, 175, 80, 0.1);
            border: 1px solid var(--success-color);
            color: var(--success-color);
        }

        .alert-error {
            background: rgba(244, 67, 54, 0.1);
            border: 1px solid var(--error-color);
            color: var(--error-color);
        }

        @media (max-width: 768px) {
            .admin-title { font-size: 2rem; }
            .admin-subtitle { font-size: 1rem; }
            .interactive-card { padding: 20px; }
            .modern-section-title { font-size: 1.1rem; }
            .stats-grid { grid-template-columns: 1fr; }
            .word-definition-preview { max-height: 500px; }
            .definition-fade { height: 100px; }
        }

        @media (max-width: 480px) {
            .admin-header { padding: 30px 0; }
            .admin-title { font-size: 1.8rem; }
            .main-content { padding: 30px 0; }
            .modern-section { margin-bottom: 40px; }
            .read-more-btn { 
                padding: 10px 18px; 
                font-size: 13px; 
                width: auto; 
                min-width: 140px; 
                border: 2px solid transparent !important; 
                display: flex; 
                justify-content: center; 
            }
            .word-actions {
                flex-direction: column;
            }
            .btn-small {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <header class="admin-header">
        <div class="container">
            <h1 class="admin-title">Admin Panel</h1>
            <p class="admin-subtitle">Manage your Pearls of Knowledge</p>
        </div>
    </header>

    <div class="container">
        <div class="main-content">
            <div id="successAlert" class="alert alert-success" style="display: none;">
                <i class="fas fa-check-circle"></i> Operation completed successfully!
            </div>
            
            <div id="errorAlert" class="alert alert-error" style="display: none;">
                <i class="fas fa-exclamation-circle"></i> An error occurred. Please try again.
            </div>

            <section class="modern-section">
                <h2 class="modern-section-title">Add New Word</h2>
                <div class="interactive-card">
                    <form id="addWordForm">
                        <div class="form-group">
                            <label class="form-label" for="word">Word</label>
                            <input type="text" id="word" class="form-input" placeholder="Enter the word" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="definition">Definition</label>
                            <textarea id="definition" class="form-textarea" placeholder="Enter the definition (HTML supported)" required></textarea>
                        </div>
                        <div class="form-group">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-plus-circle"></i> Add Word
                            </button>
                        </div>
                    </form>
                </div>
            </section>

            <section class="modern-section">
                <h2 class="modern-section-title">Preview</h2>
                <div class="interactive-card">
                    <div id="wordPreview">
                        <p class="text-muted">Enter a word and definition above to see preview</p>
                    </div>
                </div>
            </section>

            <section class="modern-section">
                <h2 class="modern-section-title">Manage Words</h2>
                <div class="interactive-card">
                    <div class="form-group">
                        <input type="text" id="searchWords" class="form-input" placeholder="Search words...">
                    </div>
                    <div class="words-list" id="wordsList">
                        <!-- Words will be loaded here -->
                    </div>
                </div>
            </section>

            <section class="modern-section">
                <h2 class="modern-section-title">Statistics</h2>
                <div class="stats-grid">
                    <div class="stat-item">
                        <div class="stat-number" id="totalWords">0</div>
                        <div class="stat-label">Total Words</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-number" id="todayAdded">0</div>
                        <div class="stat-label">Added Today</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-number" id="thisWeek">0</div>
                        <div class="stat-label">This Week</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-number" id="thisMonth">0</div>
                        <div class="stat-label">This Month</div>
                    </div>
                </div>
            </section>

            <section class="modern-section">
                <h2 class="modern-section-title">Database Operations</h2>
                <div class="interactive-card">
                    <div class="form-group">
                        <button class="btn btn-secondary" onclick="exportDatabase()">
                            <i class="fas fa-download"></i> Export Database
                        </button>
                        <button class="btn btn-secondary" onclick="importDatabase()" style="margin-left: 10px;">
                            <i class="fas fa-upload"></i> Import Database
                        </button>
                        <button class="btn btn-danger" onclick="clearDatabase()" style="margin-left: 10px;">
                            <i class="fas fa-trash"></i> Clear All Data
                        </button>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://jlzzxruwxyzswzgppkgq.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impsenp4cnV3eHl6c3d6Z3Bwa2dxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjE5MjEyNDksImV4cCI6MjA3NzQ5NzI0OX0.fgL70q1wRSWH4OOn3x_Gh76EZA0JIxGJsWfMTPpSBZM';

        let supabaseClient;
        let words = [];

        // Safe Storage implementation
        const SafeStorage = {
            isAvailable: false,
            memoryStorage: {},
            init() {
                try {
                    const test = '__storage_test__';
                    localStorage.setItem(test, test);
                    localStorage.removeItem(test);
                    this.isAvailable = true;
                } catch(e) {
                    console.warn('localStorage not available, using memory storage:', e);
                }
            },
            setItem(key, value) {
                try {
                    if (this.isAvailable) localStorage.setItem(key, value);
                    this.memoryStorage[key] = value;
                } catch(e) {
                    this.memoryStorage[key] = value;
                }
            },
            getItem(key) {
                try {
                    if (this.isAvailable) {
                        const value = localStorage.getItem(key);
                        if (value !== null) return value;
                    }
                    return this.memoryStorage[key] || null;
                } catch(e) {
                    return this.memoryStorage[key] || null;
                }
            },
            removeItem(key) {
                try {
                    if (this.isAvailable) localStorage.removeItem(key);
                    delete this.memoryStorage[key];
                } catch(e) {
                    delete this.memoryStorage[key];
                }
            }
        };

        SafeStorage.init();

        // Toggle animation functions
        function toggleDefinitionExpansion(button) {
            const preview = button.closest('.word-entry').querySelector('.word-definition-preview');
            const isExpanded = preview.classList.contains('expanded');
            
            if (isExpanded) {
                preview.classList.remove('expanded');
                button.innerHTML = '<span>Read more</span><span class="icon">▼</span>';
            } else {
                preview.classList.add('expanded');
                button.innerHTML = '<span>Read less</span><span class="icon">▲</span>';
                setTimeout(() => preview.scrollIntoView({ behavior: 'smooth', block: 'start' }), 300);
            }
        }

        function createExpandableDefinition(definitionHTML, word) {
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = definitionHTML;
            const textContent = tempDiv.textContent || tempDiv.innerText || '';
            
            const isLongDefinition = textContent.length > 800 || definitionHTML.includes('<h1') || 
                definitionHTML.includes('<h2') || definitionHTML.includes('<h3') || 
                definitionHTML.includes('<ul') || definitionHTML.includes('<ol');
            
            if (!isLongDefinition) {
                return `
                    <div class="word-entry">
                        <div class="word-title">${word}</div>
                        <div class="word-definition">${definitionHTML}</div>
                        <div class="word-actions">
                            <button class="btn btn-secondary btn-small" onclick="editWord('${word}')">
                                <i class="fas fa-edit"></i> Edit
                            </button>
                            <button class="btn btn-danger btn-small" onclick="deleteWord('${word}')">
                                <i class="fas fa-trash"></i> Delete
                            </button>
                        </div>
                    </div>
                `;
            }
            
            return `
                <div class="word-entry">
                    <div class="word-title">${word}</div>
                    <div class="word-definition-preview">
                        <div class="word-definition">
                            ${definitionHTML}
                        </div>
                        <div class="definition-fade"></div>
                    </div>
                    <div class="read-more-container">
                        <button class="read-more-btn" onclick="toggleDefinitionExpansion(this)">
                            <span>Read more</span>
                            <span class="icon">▼</span>
                        </button>
                    </div>
                    <div class="word-actions">
                        <button class="btn btn-secondary btn-small" onclick="editWord('${word}')">
                            <i class="fas fa-edit"></i> Edit
                        </button>
                        <button class="btn btn-danger btn-small" onclick="deleteWord('${word}')">
                            <i class="fas fa-trash"></i> Delete
                        </button>
                    </div>
                </div>
            `;
        }

        function updatePreview() {
            const word = document.getElementById('word').value;
            const definition = document.getElementById('definition').value;
            
            if (word && definition) {
                document.getElementById('wordPreview').innerHTML = createExpandableDefinition(definition, word);
            } else {
                document.getElementById('wordPreview').innerHTML = '<p class="text-muted">Enter a word and definition above to see preview</p>';
            }
        }

        // Initialize Supabase
        async function initializeSupabase() {
            try {
                const { createClient } = supabase;
                supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                
                // Load words from Supabase
                await loadWordsFromSupabase();
                
                // Update statistics
                updateStatistics();
                
            } catch(error) {
                console.error('Supabase init error:', error);
                showError('Failed to connect to database');
            }
        }

        // Load words from Supabase
        async function loadWordsFromSupabase() {
            try {
                const { data, error } = await supabaseClient
                    .from('dictionary')
                    .select('*')
                    .order('word', { ascending: true });
                
                if (error) throw error;
                
                words = data || [];
                displayWords();
                
            } catch(error) {
                console.error('Error loading words:', error);
                showError('Failed to load words from database');
            }
        }

        // Display words in the list
        function displayWords(filter = '') {
            const wordsList = document.getElementById('wordsList');
            const filteredWords = words.filter(word => 
                word.word.toLowerCase().includes(filter.toLowerCase()) ||
                word.definition.toLowerCase().includes(filter.toLowerCase())
            );
            
            if (filteredWords.length === 0) {
                wordsList.innerHTML = '<p class="text-muted">No words found</p>';
                return;
            }
            
            let html = '';
            filteredWords.forEach(item => {
                html += createExpandableDefinition(item.definition, item.word);
            });
            
            wordsList.innerHTML = html;
        }

        // Update statistics
        function updateStatistics() {
            document.getElementById('totalWords').textContent = words.length;
            
            const today = new Date().toDateString();
            const todayAdded = words.filter(word => {
                const wordDate = new Date(word.date_added).toDateString();
                return wordDate === today;
            }).length;
            
            document.getElementById('todayAdded').textContent = todayAdded;
            
            // Simple placeholder for week/month stats
            document.getElementById('thisWeek').textContent = Math.min(todayAdded * 3, words.length);
            document.getElementById('thisMonth').textContent = Math.min(todayAdded * 10, words.length);
        }

        // Add new word
        async function addWord(word, definition) {
            try {
                const { data, error } = await supabaseClient
                    .from('dictionary')
                    .insert([
                        { 
                            word: word, 
                            definition: definition,
                            date_added: new Date().toISOString()
                        }
                    ])
                    .select();
                
                if (error) throw error;
                
                // Reload words
                await loadWordsFromSupabase();
                
                // Reset form
                document.getElementById('addWordForm').reset();
                document.getElementById('wordPreview').innerHTML = '<p class="text-muted">Enter a word and definition above to see preview</p>';
                
                showSuccess('Word added successfully!');
                
            } catch(error) {
                console.error('Error adding word:', error);
                showError('Failed to add word to database');
            }
        }

        // Edit word
        function editWord(word) {
            const wordObj = words.find(w => w.word === word);
            if (wordObj) {
                document.getElementById('word').value = wordObj.word;
                document.getElementById('definition').value = wordObj.definition;
                updatePreview();
                
                // Scroll to form
                document.getElementById('addWordForm').scrollIntoView({ behavior: 'smooth' });
                
                showSuccess(`Editing word: ${word}. Update the fields and click "Add Word" to save changes.`);
            }
        }

        // Delete word
        async function deleteWord(word) {
            if (!confirm(`Are you sure you want to delete the word "${word}"?`)) {
                return;
            }
            
            try {
                const { error } = await supabaseClient
                    .from('dictionary')
                    .delete()
                    .eq('word', word);
                
                if (error) throw error;
                
                // Reload words
                await loadWordsFromSupabase();
                
                showSuccess('Word deleted successfully!');
                
            } catch(error) {
                console.error('Error deleting word:', error);
                showError('Failed to delete word from database');
            }
        }

        // Show success message
        function showSuccess(message) {
            const alert = document.getElementById('successAlert');
            alert.innerHTML = `<i class="fas fa-check-circle"></i> ${message}`;
            alert.style.display = 'block';
            
            setTimeout(() => {
                alert.style.display = 'none';
            }, 5000);
        }

        // Show error message
        function showError(message) {
            const alert = document.getElementById('errorAlert');
            alert.innerHTML = `<i class="fas fa-exclamation-circle"></i> ${message}`;
            alert.style.display = 'block';
            
            setTimeout(() => {
                alert.style.display = 'none';
            }, 5000);
        }

        // Export database
        function exportDatabase() {
            const dataStr = JSON.stringify(words, null, 2);
            const dataBlob = new Blob([dataStr], {type: 'application/json'});
            
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'pearls-of-knowledge-backup.json';
            link.click();
            
            URL.revokeObjectURL(url);
            showSuccess('Database exported successfully!');
        }

        // Import database
        function importDatabase() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            
            input.onchange = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                
                try {
                    const text = await file.text();
                    const importedData = JSON.parse(text);
                    
                    if (!Array.isArray(importedData)) {
                        throw new Error('Invalid file format');
                    }
                    
                    // Here you would typically send this to your backend
                    // For now, we'll just show a success message
                    showSuccess(`Successfully imported ${importedData.length} words!`);
                    
                } catch(error) {
                    console.error('Error importing database:', error);
                    showError('Failed to import database. Please check the file format.');
                }
            };
            
            input.click();
        }

        // Clear database
        async function clearDatabase() {
            if (!confirm('Are you sure you want to clear ALL data? This action cannot be undone.')) {
                return;
            }
            
            try {
                // This would typically be a backend operation
                // For demonstration, we'll just clear the local display
                words = [];
                displayWords();
                updateStatistics();
                
                showSuccess('All data has been cleared!');
                
            } catch(error) {
                console.error('Error clearing database:', error);
                showError('Failed to clear database');
            }
        }

        // Initialize when DOM is loaded
        document.addEventListener('DOMContentLoaded', function() {
            // Set up form submission
            document.getElementById('addWordForm').addEventListener('submit', function(e) {
                e.preventDefault();
                
                const word = document.getElementById('word').value.trim();
                const definition = document.getElementById('definition').value.trim();
                
                if (!word || !definition) {
                    showError('Please fill in both word and definition');
                    return;
                }
                
                addWord(word, definition);
            });
            
            // Set up real-time preview
            document.getElementById('word').addEventListener('input', updatePreview);
            document.getElementById('definition').addEventListener('input', updatePreview);
            
            // Set up search
            document.getElementById('searchWords').addEventListener('input', function(e) {
                displayWords(e.target.value);
            });
            
            // Initialize Supabase
            initializeSupabase();
        });
    </script>
</body>
</html>
