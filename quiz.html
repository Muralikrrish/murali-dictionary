<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LexiQuest - Vocabulary Quiz</title>
    <!-- Same fonts as index.html -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            /* Theme: Deep Navy & Saffron (Matching index.html) */
            --bg-deep: #0f172a;
            --bg-surface: rgba(30, 41, 59, 0.75);
            
            /* Glass Effects */
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-highlight: rgba(255, 255, 255, 0.05);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
            --backdrop-blur: blur(16px);

            /* Accents */
            --primary: #fbbf24; /* Amber-400 */
            --primary-dim: #d97706;
            --primary-glow: rgba(251, 191, 36, 0.25);
            
            --accent-gradient: linear-gradient(135deg, #fbbf24, #f59e0b);
            
            --success: #34d399;
            --error: #f87171;

            /* Text Colors */
            --text-main: #f8fafc;
            --text-bright-dim: #cbd5e1;
            --text-muted: #94a3b8;
            --text-header: #64748b;

            /* Spacing */
            --radius-lg: 24px;
            --radius-md: 16px;
            --radius-sm: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            line-height: 1.7;
            min-height: 100vh;
            padding: 40px 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* --- Ambient Background --- */
        .ambient-light {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            overflow: hidden;
            pointer-events: none;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.4;
            animation: float 25s infinite ease-in-out;
        }

        .orb-1 { top: -20%; left: -10%; width: 70vw; height: 70vw; background: radial-gradient(circle, #1e293b 0%, transparent 70%); animation-delay: 0s; }
        .orb-2 { bottom: -20%; right: -10%; width: 50vw; height: 50vw; background: radial-gradient(circle, #334155 0%, transparent 70%); animation-delay: -5s; }
        .orb-3 { top: 40%; left: 40%; width: 30vw; height: 30vw; background: radial-gradient(circle, rgba(251, 191, 36, 0.1) 0%, transparent 70%); animation-delay: -10s; opacity: 0.3; }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(40px, -60px) scale(1.1); }
            66% { transform: translate(-30px, 30px) scale(0.9); }
        }

        /* --- Background Icons --- */
        .bg-decoration {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
            overflow: hidden;
        }

        .bg-icon {
            position: absolute;
            opacity: 0.08;
            font-size: 2rem;
        }

        /* Identical icon placement to index.html */
        .icon-1 { top: 12%; left: 8%; font-size: 5rem; transform: rotate(-15deg); color: #fbbf24; }
        .icon-2 { top: 18%; right: 12%; font-size: 3.5rem; transform: rotate(10deg); color: #38bdf8; }
        .icon-3 { bottom: 25%; left: 10%; font-size: 6rem; transform: rotate(5deg); color: #34d399; }
        .icon-4 { bottom: 15%; right: 8%; font-size: 4.5rem; transform: rotate(-20deg); color: #f472b6; }
        .icon-5 { top: 45%; left: 3%; font-size: 3rem; transform: rotate(30deg); color: #a78bfa; }
        .icon-6 { top: 55%; right: 5%; font-size: 3.5rem; transform: rotate(-10deg); color: #fb7185; }
        .icon-7 { top: 8%; left: 45%; font-size: 2.5rem; transform: rotate(45deg); color: #94a3b8; opacity: 0.06; }
        .icon-8 { bottom: 40%; right: 40%; font-size: 8rem; transform: rotate(0deg); color: #1e293b; opacity: 0.3; z-index: -2; }

        .container {
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        /* --- Quiz Card (Glassmorphism) --- */
        .quiz-container {
            background: var(--bg-surface);
            backdrop-filter: var(--backdrop-blur);
            -webkit-backdrop-filter: var(--backdrop-blur);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            box-shadow: var(--glass-shadow);
            overflow: hidden;
            width: 100%;
            transition: transform 0.3s ease;
        }

        .quiz-header {
            padding: 40px 30px 20px;
            text-align: center;
            border-bottom: 1px solid var(--glass-border);
        }

        .quiz-title {
            font-family: 'Playfair Display', serif;
            font-size: 2.8rem;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(to bottom, #f8fafc 30%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.1;
        }

        .quiz-subtitle {
            font-size: 1.1rem;
            color: var(--text-muted);
            font-weight: 400;
        }

        /* --- Progress Bar --- */
        .progress-container {
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.2);
        }

        #question-count {
            color: var(--text-bright-dim);
            font-weight: 600;
            font-size: 0.95rem;
        }

        .progress-bar {
            flex-grow: 1;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            margin: 0 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent-gradient);
            width: 0%;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 10px var(--primary-glow);
        }

        /* --- Stats & Timer --- */
        .question-stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px 0;
            margin-bottom: 10px;
        }

        .current-score {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--primary);
            font-family: 'Playfair Display', serif;
            letter-spacing: 0.05em;
        }

        .fast-fingers-timer {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .timer-circle {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: var(--bg-deep);
            border: 2px solid var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: var(--primary);
            box-shadow: 0 0 15px var(--primary-glow);
            font-family: 'JetBrains Mono', monospace;
        }

        .timer-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 600;
        }

        /* --- Question Area --- */
        .question-card {
            padding: 10px 30px 40px;
        }

        .question-text {
            font-size: 1.35rem;
            font-weight: 600;
            color: var(--text-main);
            line-height: 1.5;
            margin-bottom: 30px;
            padding: 24px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-md);
            text-align: center;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            margin-bottom: 24px;
        }

        .option-btn {
            padding: 20px 24px;
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-md);
            background: rgba(255, 255, 255, 0.02);
            font-size: 1.05rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-muted);
            min-height: 64px;
            display: flex;
            align-items: center;
            font-family: 'Plus Jakarta Sans', sans-serif;
            position: relative;
            overflow: hidden;
        }

        .option-btn:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateX(4px);
            color: var(--text-main);
        }

        .option-btn.selected {
            border-color: var(--primary);
            background: var(--primary);
            color: #0f172a; /* Dark text on gold bg */
            font-weight: 600;
            box-shadow: 0 0 20px var(--primary-glow);
        }

        .option-btn.correct {
            background: rgba(16, 185, 129, 0.15);
            border-color: var(--success);
            color: var(--success);
        }

        .option-btn.incorrect {
            background: rgba(248, 113, 113, 0.15);
            border-color: var(--error);
            color: var(--error);
        }

        /* --- Explanation Box --- */
        .explanation-box {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(251, 191, 36, 0.3);
            border-radius: var(--radius-md);
            margin-top: 24px;
            display: none;
            color: var(--text-muted);
            font-size: 1rem;
            line-height: 1.6;
            overflow: hidden;
        }

        .explanation-box.show {
            display: block;
            animation: slideDown 0.4s ease;
        }

        .explanation-preview {
            position: relative;
            max-height: 120px;
            overflow: hidden;
            transition: max-height 0.4s ease-in-out;
        }

        .explanation-preview.expanded {
            max-height: none;
        }

        .explanation-content {
            padding: 24px;
        }
        
        .explanation-content strong {
            color: var(--primary);
        }

        .explanation-fade {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: linear-gradient(to bottom, transparent, #162032); /* Matches bg-surface mix */
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .explanation-preview.expanded .explanation-fade {
            opacity: 0;
        }

        .explanation-read-more-container {
            display: flex;
            justify-content: center;
            padding-bottom: 20px;
        }

        .explanation-read-more-btn {
            background: transparent;
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50px;
            padding: 8px 20px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .explanation-read-more-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-2px);
            background: rgba(251, 191, 36, 0.1);
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- Next Button --- */
        .action-buttons {
            display: flex;
            justify-content: center;
            margin-top: 30px;
        }

        .btn-next {
            background: var(--text-main);
            color: var(--bg-deep);
            border: none;
            border-radius: 50px;
            padding: 14px 32px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            display: none; /* Hidden by default */
        }

        .btn-next:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 255, 255, 0.2);
            background: white;
        }

        /* --- Results Screen --- */
        .results-screen {
            padding: 50px 30px;
            text-align: center;
            display: none;
        }
        
        .results-screen h2 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            color: var(--text-main);
            margin-bottom: 10px;
        }

        .score-display {
            font-size: 4rem;
            font-weight: 700;
            font-family: 'Playfair Display', serif;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 20px 0;
            text-shadow: 0 10px 30px rgba(251, 191, 36, 0.2);
        }

        .correct-answers {
            font-size: 1.4rem;
            color: var(--text-bright-dim);
            margin-bottom: 10px;
        }

        .score-summary {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 30px;
            font-family: 'JetBrains Mono', monospace;
        }

        .encouragement {
            font-size: 1.25rem;
            color: var(--primary);
            margin-bottom: 40px;
            font-weight: 600;
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            color: var(--error);
            padding: 16px;
            border-radius: var(--radius-sm);
            margin: 20px 0;
            text-align: center;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        /* --- Skeletons --- */
        .skeleton-loading {
            background: rgba(255, 255, 255, 0.02);
            border-radius: var(--radius-md);
            padding: 30px;
            border: 1px solid var(--glass-border);
            animation: pulse 2s ease-in-out infinite;
        }

        .skeleton-line {
            height: 16px;
            background: linear-gradient(90deg, rgba(255,255,255,0.03) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.03) 75%);
            background-size: 200% 100%;
            border-radius: 4px;
            margin-bottom: 16px;
            animation: shimmer 1.5s infinite;
        }

        .skeleton-line.short { width: 60%; }
        .skeleton-line.long { width: 90%; }
        .skeleton-line.extra-long { width: 100%; height: 24px; margin-bottom: 24px; }

        .skeleton-title {
            height: 32px;
            background: linear-gradient(90deg, rgba(255,255,255,0.03) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.03) 75%);
            background-size: 200% 100%;
            border-radius: 6px;
            margin-bottom: 30px;
            width: 40%;
            animation: shimmer 1.5s infinite;
        }

        @keyframes pulse { 0%, 100% { opacity: 1 } 50% { opacity: 0.6 } }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }

        /* --- Mobile Responsive --- */
        @media (max-width: 768px) {
            body { padding: 16px 12px; }
            .quiz-header { padding: 30px 20px 20px; }
            .quiz-title { font-size: 2.2rem; }
            .question-text { font-size: 1.15rem; color: var(--text-muted); padding: 20px; }
            .options-grid { gap: 12px; }
            .option-btn { padding: 16px; min-height: 56px; font-size: 1rem; }
            
            /* Mobile icon adjustment */
            .bg-decoration { top: -15%; }
        }

        @media (max-width: 480px) {
            .quiz-title { font-size: 1.8rem; }
            .progress-container { padding: 15px 20px; }
            .timer-circle { width: 36px; height: 36px; font-size: 0.9rem; }
            .question-text { font-size: 1.1rem; margin-bottom: 20px; }
            .option-btn { padding: 14px; font-size: 0.95rem; }
            .btn-next { width: 100%; }
        }

        body.android-app .ui-controls,
        body.android-app .hero-section,
        body.android-app .desktop-nav,
        body.android-app .bg-decoration {
            display: none !important;
        }

        body.android-app .container {
            padding-top: 20px !important;
        }
        body.android-app .search-container {
            display: block !important;
            margin-top: 10px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <!-- Ambient Background -->
    <div class="ambient-light">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <!-- Background Icons -->
    <div class="bg-decoration">
        <i class="fas fa-book-open bg-icon icon-1"></i>
        <i class="fas fa-lightbulb bg-icon icon-2"></i>
        <i class="fas fa-brain bg-icon icon-3"></i>
        <i class="fas fa-pen-nib bg-icon icon-4"></i>
        <i class="fas fa-atom bg-icon icon-5"></i>
        <i class="fas fa-globe-americas bg-icon icon-6"></i>
        <i class="fas fa-dna bg-icon icon-7"></i>
        <i class="fas fa-quote-left bg-icon icon-8"></i>
    </div>

    <div class="container">
        <div class="quiz-container">
            <div class="quiz-header">
                <h1 class="quiz-title">LexiQuest</h1>
                <p class="quiz-subtitle">Test your vocabulary knowledge</p>
            </div>

            <div class="progress-container">
                <span id="question-count">Question 1/10</span>
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
            </div>

            <div class="question-stats" id="question-stats" style="display: none;">
                <div class="current-score">Score: <span id="current-score">0</span></div>
                <div class="fast-fingers-timer" id="fast-fingers-timer">
                    <div class="timer-label">Time</div>
                    <div class="timer-circle" id="timer-value">20</div>
                </div>
            </div>

            <div class="question-card" id="question-card">
                <div class="skeleton-loading" id="loading-message">
                    <div class="skeleton-title"></div>
                    <div class="skeleton-line extra-long"></div>
                    <div class="skeleton-line long"></div>
                    <div class="skeleton-line long"></div>
                    <div class="skeleton-line long"></div>
                </div>
                <div class="error-message" id="error-message" style="display: none;"></div>
                
                <div id="quiz-content" style="display: none;">
                    <div class="question-text" id="question-text">
                        Loading question...
                    </div>
                    
                    <div class="options-grid" id="options-grid">
                    </div>
                    <div class="explanation-box" id="explanation-box">
                        <div class="explanation-preview">
                            <div class="explanation-content">
                                <strong>Insight:</strong> <span id="explanation-text"></span>
                            </div>
                            <div class="explanation-fade"></div>
                        </div>
                        <div class="explanation-read-more-container">
                            <button class="explanation-read-more-btn" onclick="toggleExplanationExpansion(this, 'explanation-box')">
                                <span>Read more</span>
                            </button>
                        </div>
                    </div>
                    <div class="action-buttons">
                        <button class="btn-next" onclick="nextQuestion()" id="next-btn">Next Question <i class="fas fa-arrow-right" style="margin-left: 8px;"></i></button>
                    </div>
                </div>
            </div>

            <div class="results-screen" id="results-screen">
                <h2>Quiz Complete!</h2>
                <div class="score-display" id="final-score">0</div>
                <div class="correct-answers" id="correct-answers">You've got 0/10 correct!</div>
                <div class="score-summary" id="score-summary">Your score: 0/2000</div>
                <div class="encouragement" id="encouragement-message">Keep practicing!</div>
                <div class="action-buttons">
                    <button class="btn-next" style="display: inline-flex;" onclick="restartQuiz()">Try Again <i class="fas fa-redo" style="margin-left: 8px;"></i></button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- 100% Preserved Logic from original file ---
        const SUPABASE_URL = 'https://jlzzxruwxyzswzgppkgq.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impsenp4cnV3eHl6c3d6Z3Bwa2dxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjE5MjEyNDksImV4cCI6MjA3NzQ5NzI0OX0.fgL70q1wRSWH4OOn3x_Gh76EZA0JIxGJsWfMTPpSBZM';
        
        let currentQuestion = 0;
        let score = 0;
        let questions = [];
        let selectedAnswer = null;
        let answerSubmitted = false;
        let questionsAnswered = 0;
        const TOTAL_QUESTIONS = 10;
        
        let fastFingersBonus = 150;
        let timerInterval;
        let timeLeft = 20;
        let currentQuestionPoints = 0;
        let totalFastFingersPoints = 0;
        let totalCorrectAnswers = 0;

        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(frequency, duration, type = 'sine', volume = 0.3) {
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
            
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.value = frequency;
            oscillator.type = type;
            
            gainNode.gain.setValueAtTime(volume, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + duration);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + duration);
        }
        
        function playCorrectSound() {
            playSound(800, 0.1, 'sine', 0.2);
        }
        
        function playIncorrectSound() {
            playSound(400, 0.15, 'sine', 0.2);
        }
        
        function playSelectSound() {
            playSound(600, 0.05, 'sine', 0.1);
        }
        
        function playNextSound() {
            playSound(700, 0.08, 'sine', 0.15);
        }
        
        function playTimerTick() {
            playSound(300, 0.03, 'sine', 0.1);
        }
        
        function playCompleteSound() {
            const notes = [523.25, 659.25, 783.99]; 
            let time = audioContext.currentTime;
            notes.forEach((note, index) => {
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                oscillator.frequency.value = note;
                oscillator.type = 'sine';
                gainNode.gain.setValueAtTime(0, time);
                gainNode.gain.linearRampToValueAtTime(0.2, time + 0.05);
                gainNode.gain.exponentialRampToValueAtTime(0.001, time + 0.3);
                oscillator.start(time);
                oscillator.stop(time + 0.3);
                time += 0.1;
            });
        }

        function toggleExplanationExpansion(button, explanationId) {
            const explanationBox = document.getElementById(explanationId);
            const preview = explanationBox.querySelector('.explanation-preview');
            const isExpanded = preview.classList.contains('expanded');
            
            if (isExpanded) {
                preview.classList.remove('expanded');
                button.innerHTML = '<span>Read more</span>';
            } else {
                preview.classList.add('expanded');
                button.innerHTML = '<span>Read less</span>';
            }
        }

        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        async function initQuiz() {
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/quiz_questions?select=*`, {
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const allQuestions = await response.json();

                if (allQuestions.length === 0) {
                    showError('No questions found in the database.');
                    return;
                }

                questions = getRandomQuestions(allQuestions, TOTAL_QUESTIONS);

                document.getElementById('loading-message').style.display = 'none';
                document.getElementById('quiz-content').style.display = 'block';
                document.getElementById('question-stats').style.display = 'flex';
                
                displayQuestion();
            } catch (error) {
                console.error('Error fetching questions:', error);
                showError(`Failed to load questions: ${error.message}`);
            }
        }

        function getRandomQuestions(allQuestions, count) {
            const shuffled = [...allQuestions].sort(() => 0.5 - Math.random());
            return shuffled.slice(0, count);
        }

        function showError(message) {
            document.getElementById('loading-message').style.display = 'none';
            document.getElementById('error-message').style.display = 'block';
            document.getElementById('error-message').textContent = message;
        }

        function displayQuestion() {
            if (currentQuestion >= questions.length) {
                showResults();
                return;
            }

            const question = questions[currentQuestion];
            document.getElementById('question-text').textContent = question.question_text;
            
            document.getElementById('question-count').textContent = `Question ${currentQuestion + 1}/${TOTAL_QUESTIONS}`;
            document.getElementById('progress-fill').style.width = `${(questionsAnswered / TOTAL_QUESTIONS) * 100}%`;

            document.getElementById('current-score').textContent = score;
            
            resetTimer();
            
            document.getElementById('question-stats').style.display = 'flex';
            document.getElementById('fast-fingers-timer').style.display = 'flex';

            const optionsGrid = document.getElementById('options-grid');
            optionsGrid.innerHTML = '';
            
            const optionsArray = Array.isArray(question.options) ? question.options : JSON.parse(question.options || '[]');
            
            const originalCorrectAnswer = optionsArray[question.correct_answer];
            
            const shuffledOptions = shuffleArray(optionsArray);
            
            const newCorrectAnswerIndex = shuffledOptions.indexOf(originalCorrectAnswer);
            
            question.shuffledOptions = shuffledOptions;
            question.currentCorrectAnswer = newCorrectAnswerIndex;
            
            shuffledOptions.forEach((option, index) => {
                const button = document.createElement('button');
                button.className = 'option-btn';
                button.textContent = option;
                button.onclick = () => selectAnswer(index);
                optionsGrid.appendChild(button);
            });

            document.getElementById('explanation-box').classList.remove('show');
            
            if (currentQuestion === TOTAL_QUESTIONS - 1) {
                document.getElementById('next-btn').innerHTML = 'See Results <i class="fas fa-arrow-right" style="margin-left: 8px;"></i>';
            } else {
                document.getElementById('next-btn').innerHTML = 'Next Question <i class="fas fa-arrow-right" style="margin-left: 8px;"></i>';
            }
            
            document.getElementById('next-btn').style.display = 'none';
            answerSubmitted = false;
            selectedAnswer = null;
            
            startTimer();
        }

        function resetTimer() {
            clearInterval(timerInterval);
            timeLeft = 20;
            document.getElementById('timer-value').textContent = timeLeft;
            fastFingersBonus = 150;
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer-value').textContent = timeLeft;
                
                if (timeLeft < 15) {
                    fastFingersBonus = Math.max(0, fastFingersBonus - 10);
                }
                
                if (timeLeft <= 5 && timeLeft > 0) {
                    playTimerTick();
                }
                
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    document.getElementById('fast-fingers-timer').style.display = 'none';
                }
            }, 1000);
        }

        function selectAnswer(index) {
            if (answerSubmitted) return;
            
            selectedAnswer = index;
            answerSubmitted = true;
            
            playSelectSound();
            
            clearInterval(timerInterval);
            
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(btn => btn.classList.remove('selected'));
            buttons[index].classList.add('selected');
            
            submitAnswer();
        }

        function submitAnswer() {
            if (selectedAnswer === null) return;

            const question = questions[currentQuestion];
            const isCorrect = selectedAnswer === question.currentCorrectAnswer;
            
            if (isCorrect) {
                playCorrectSound();
            } else {
                playIncorrectSound();
            }
            
            currentQuestionPoints = isCorrect ? 50 : 0;
            if (isCorrect) {
                currentQuestionPoints += fastFingersBonus;
                totalFastFingersPoints += fastFingersBonus;
                totalCorrectAnswers++;
            }
            
            score += currentQuestionPoints;

            document.getElementById('current-score').textContent = score;
            
            questionsAnswered++;
            document.getElementById('progress-fill').style.width = `${(questionsAnswered / TOTAL_QUESTIONS) * 100}%`;

            document.getElementById('explanation-text').textContent = question.explanation;
            
            document.getElementById('explanation-box').classList.add('show');

            document.getElementById('next-btn').style.display = 'inline-flex';

            const buttons = document.querySelectorAll('.option-btn');
            
            buttons[question.currentCorrectAnswer].classList.add('correct');
            
            if (!isCorrect) {
                buttons[selectedAnswer].classList.add('incorrect');
            }
            
            buttons.forEach(btn => {
                btn.style.cursor = 'default';
                btn.onclick = null;
            });
        }

        function nextQuestion() {
            playNextSound();
            currentQuestion++;
            displayQuestion();
        }

        function showResults() {
            playCompleteSound();
            
            document.getElementById('progress-fill').style.width = '100%';
            document.getElementById('question-card').style.display = 'none';
            document.getElementById('question-stats').style.display = 'none';
            document.getElementById('results-screen').style.display = 'block';
            document.getElementById('final-score').textContent = score;
            
            document.getElementById('correct-answers').textContent = `You've got ${totalCorrectAnswers}/10 correct!`;
            document.getElementById('score-summary').textContent = `Your score: ${score}/2000`;
            
            const percentage = (totalCorrectAnswers / TOTAL_QUESTIONS) * 100;
            let message = '';
            if (percentage >= 80) message = 'Outstanding! You\'re a vocabulary master! 🎯';
            else if (percentage >= 60) message = 'Great job! You\'re getting there! 💪';
            else message = 'Keep practicing! You\'ll improve! 📚';
            
            document.getElementById('encouragement-message').textContent = message;
        }

        function restartQuiz() {
            currentQuestion = 0;
            score = 0;
            questionsAnswered = 0;
            totalFastFingersPoints = 0;
            totalCorrectAnswers = 0;
            clearInterval(timerInterval);
            
            document.getElementById('results-screen').style.display = 'none';
            document.getElementById('question-card').style.display = 'block';
            document.getElementById('loading-message').style.display = 'block';
            document.getElementById('quiz-content').style.display = 'none';
            document.getElementById('question-stats').style.display = 'none';
            document.getElementById('error-message').style.display = 'none';
            initQuiz();
        }

        window.onload = initQuiz;
    </script>
</body>
</html>
