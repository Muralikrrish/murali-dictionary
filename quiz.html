<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Mastery Quiz - Murali Dictionary</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .quiz-container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .quiz-header {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .quiz-header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .quiz-header p {
            opacity: 0.9;
            font-size: 1.1rem;
        }

        .progress-container {
            background: #f1f5f9;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e2e8f0;
        }

        .progress-bar {
            flex-grow: 1;
            height: 8px;
            background: #e2e8f0;
            border-radius: 10px;
            margin: 0 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #10b981, #34d399);
            width: 0%;
            transition: width 0.3s ease;
        }

        .question-card {
            padding: 40px;
        }

        .question-header {
            display: flex;
            justify-content: between;
            align-items: center;
            margin-bottom: 25px;
        }

        .difficulty-badge {
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .badge-easy { background: #d1fae5; color: #065f46; }
        .badge-medium { background: #fef3c7; color: #92400e; }
        .badge-hard { background: #fee2e2; color: #991b1b; }

        .question-text {
            font-size: 1.4rem;
            font-weight: 600;
            color: #1f2937;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        .options-grid {
            display: grid;
            gap: 15px;
            margin-bottom: 30px;
        }

        .option-btn {
            padding: 20px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            background: white;
            font-size: 1.1rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-btn:hover {
            border-color: #4f46e5;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .option-btn.selected {
            border-color: #4f46e5;
            background: #4f46e5;
            color: white;
        }

        .explanation-box {
            background: #f8fafc;
            padding: 25px;
            border-radius: 12px;
            border-left: 4px solid #4f46e5;
            margin-top: 20px;
            display: none;
        }

        .explanation-box.show {
            display: block;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: #4f46e5;
            color: white;
        }

        .btn-primary:hover {
            background: #4338ca;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #f1f5f9;
            color: #64748b;
        }

        .btn-secondary:hover {
            background: #e2e8f0;
        }

        .results-screen {
            padding: 50px;
            text-align: center;
            display: none;
        }

        .score-display {
            font-size: 4rem;
            font-weight: 700;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 20px 0;
        }

        .encouragement {
            font-size: 1.5rem;
            color: #1f2937;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <div class="quiz-container">
        <div class="quiz-header">
            <h1>Word Mastery Quiz</h1>
            <p>Test your vocabulary knowledge with challenging questions</p>
        </div>

        <div class="progress-container">
            <span id="question-count">Question 1/3</span>
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            <span id="score">Score: 0</span>
        </div>

        <div class="question-card" id="question-card">
            <div class="question-header">
                <span class="difficulty-badge" id="difficulty-badge">Medium</span>
            </div>
            <div class="question-text" id="question-text">
                Loading question...
            </div>
            <div class="options-grid" id="options-grid">
                <!-- Options will be inserted here -->
            </div>
            <div class="explanation-box" id="explanation-box">
                <strong>Explanation:</strong> <span id="explanation-text"></span>
            </div>
            <div class="action-buttons">
                <button class="btn btn-secondary" onclick="skipQuestion()" id="skip-btn">Skip</button>
                <button class="btn btn-primary" onclick="submitAnswer()" id="submit-btn" disabled>Submit Answer</button>
                <button class="btn btn-primary" onclick="nextQuestion()" id="next-btn" style="display: none;">Next Question</button>
            </div>
        </div>

        <div class="results-screen" id="results-screen">
            <h2>Quiz Complete! 🎉</h2>
            <div class="score-display" id="final-score">0/3</div>
            <div class="encouragement" id="encouragement-message">Keep practicing!</div>
            <button class="btn btn-primary" onclick="restartQuiz()">Try Again</button>
        </div>
    </div>

    <script>
        // Supabase configuration - use the same as your main site
        const SUPABASE_URL = 'https://jlzzxruwxyzswzgppkgq.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impsenp4cnV3eHl6c3d6Z3Bwa2dxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjE5MjEyNDksImV4cCI6MjA3NzQ5NzI0OX0.fgL70q1wRSWH4OOn3x_Gh76EZA0JIxGJsWfMTPpSBZM';
        
        let currentQuestion = 0;
        let score = 0;
        let questions = [];
        let selectedAnswer = null;

        // Initialize quiz
        async function initQuiz() {
            try {
                // Fetch questions from Supabase
                const response = await fetch(`${SUPABASE_URL}/rest/v1/quiz_questions?select=*`, {
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`
                    }
                });
                
                questions = await response.json();
                displayQuestion();
            } catch (error) {
                console.error('Error fetching questions:', error);
                document.getElementById('question-text').textContent = 'Error loading questions. Please try again.';
            }
        }

        function displayQuestion() {
            if (currentQuestion >= questions.length) {
                showResults();
                return;
            }

            const question = questions[currentQuestion];
            document.getElementById('question-text').textContent = question.question_text;
            document.getElementById('difficulty-badge').textContent = question.difficulty;
            document.getElementById('difficulty-badge').className = `difficulty-badge badge-${question.difficulty}`;
            
            // Update progress
            document.getElementById('question-count').textContent = `Question ${currentQuestion + 1}/${questions.length}`;
            document.getElementById('progress-fill').style.width = `${((currentQuestion) / questions.length) * 100}%`;
            document.getElementById('score').textContent = `Score: ${score}`;

            // Create options
            const optionsGrid = document.getElementById('options-grid');
            optionsGrid.innerHTML = '';
            
            question.options.forEach((option, index) => {
                const button = document.createElement('button');
                button.className = 'option-btn';
                button.textContent = option;
                button.onclick = () => selectAnswer(index);
                optionsGrid.appendChild(button);
            });

            // Reset UI state
            document.getElementById('explanation-box').classList.remove('show');
            document.getElementById('submit-btn').disabled = true;
            document.getElementById('submit-btn').style.display = 'block';
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('skip-btn').style.display = 'block';
            selectedAnswer = null;
        }

        function selectAnswer(index) {
            selectedAnswer = index;
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(btn => btn.classList.remove('selected'));
            buttons[index].classList.add('selected');
            document.getElementById('submit-btn').disabled = false;
        }

        function submitAnswer() {
            if (selectedAnswer === null) return;

            const question = questions[currentQuestion];
            const isCorrect = selectedAnswer === question.correct_answer;
            
            if (isCorrect) {
                score++;
            }

            // Show explanation
            document.getElementById('explanation-text').textContent = question.explanation;
            document.getElementById('explanation-box').classList.add('show');

            // Update UI
            document.getElementById('submit-btn').style.display = 'none';
            document.getElementById('next-btn').style.display = 'block';
            document.getElementById('skip-btn').style.display = 'none';
            document.getElementById('score').textContent = `Score: ${score}`;

            // Highlight correct answer
            const buttons = document.querySelectorAll('.option-btn');
            buttons[question.correct_answer].style.background = '#d1fae5';
            buttons[question.correct_answer].style.borderColor = '#10b981';
            
            if (!isCorrect) {
                buttons[selectedAnswer].style.background = '#fee2e2';
                buttons[selectedAnswer].style.borderColor = '#ef4444';
            }
        }

        function nextQuestion() {
            currentQuestion++;
            displayQuestion();
        }

        function skipQuestion() {
            currentQuestion++;
            displayQuestion();
        }

        function showResults() {
            document.getElementById('question-card').style.display = 'none';
            document.getElementById('results-screen').style.display = 'block';
            document.getElementById('final-score').textContent = `${score}/${questions.length}`;
            
            // Encouragement message
            const percentage = (score / questions.length) * 100;
            let message = '';
            if (percentage >= 80) message = 'Outstanding! You\'re a vocabulary master! 🎯';
            else if (percentage >= 60) message = 'Great job! You\'re getting there! 💪';
            else message = 'Keep practicing! You\'ll improve! 📚';
            
            document.getElementById('encouragement-message').textContent = message;
        }

        function restartQuiz() {
            currentQuestion = 0;
            score = 0;
            document.getElementById('results-screen').style.display = 'none';
            document.getElementById('question-card').style.display = 'block';
            displayQuestion();
        }

        // Start the quiz when page loads
        window.onload = initQuiz;
    </script>
</body>
</html>
