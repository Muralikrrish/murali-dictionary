<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lexicon Quest - Murali Dictionary</title>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        /* CSS Variables for consistent theming */
        :root {
            --bg-primary: #1a1a1a;
            --bg-secondary: #242424;
            --bg-tertiary: #2a2a2a;
            --accent-primary: #c87941;
            --accent-secondary: #d89057;
            --text-primary: #e8e8e8;
            --text-secondary: #b8b8b8;
            --text-muted: #666;
            --border-color: #3d3d3d;
            --success-color: #7bc87f;
            --warning-color: #f39c12;
            --error-color: #d9534f;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Google Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            padding: 20px;
        }

        .quiz-container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--bg-secondary);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        /* Simplified Modern Header */
        .quiz-header {
            background: var(--bg-secondary);
            color: var(--text-primary);
            padding: 25px 30px 15px 30px;
            text-align: center;
            position: relative;
            border-bottom: 1px solid var(--border-color);
        }

        .quiz-title {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--text-primary) 0%, var(--accent-secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.02em;
        }

        .quiz-subtitle {
            font-size: 1rem;
            color: var(--text-secondary);
            font-weight: 400;
        }

        .progress-container {
            background: var(--bg-tertiary);
            padding: 12px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .progress-bar {
            flex-grow: 1;
            height: 6px;
            background: var(--border-color);
            border-radius: 10px;
            margin: 0 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
            width: 0%;
            transition: width 0.3s ease;
        }

        .question-card {
            padding: 30px;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .difficulty-badge {
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            border: 1px solid;
        }

        .badge-easy { 
            background: rgba(123, 200, 127, 0.1); 
            color: #7bc87f; 
            border-color: rgba(123, 200, 127, 0.3);
        }
        .badge-medium { 
            background: rgba(243, 156, 18, 0.1); 
            color: #f39c12; 
            border-color: rgba(243, 156, 18, 0.3);
        }
        .badge-hard { 
            background: rgba(217, 83, 79, 0.1); 
            color: #d9534f; 
            border-color: rgba(217, 83, 79, 0.3);
        }

        .question-text {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--text-primary);
            line-height: 1.5;
            margin-bottom: 25px;
            padding: 20px;
            background: var(--bg-tertiary);
            border-radius: 12px;
            border-left: 4px solid var(--accent-primary);
        }

        .options-grid {
            display: grid;
            gap: 12px;
            margin-bottom: 25px;
        }

        .option-btn {
            padding: 18px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            background: var(--bg-tertiary);
            font-size: 1rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-primary);
        }

        .option-btn:hover {
            border-color: var(--accent-primary);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(200, 121, 65, 0.2);
        }

        .option-btn.selected {
            border-color: var(--accent-primary);
            background: var(--accent-primary);
            color: var(--bg-primary);
        }

        .explanation-box {
            background: var(--bg-tertiary);
            padding: 20px;
            border-radius: 12px;
            border-left: 4px solid var(--accent-primary);
            margin-top: 20px;
            display: none;
            color: var(--text-primary);
        }

        .explanation-box.show {
            display: block;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .action-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 25px;
        }

        .btn {
            padding: 14px 25px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            flex: 1;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-secondary) 100%);
            color: var(--bg-primary);
            box-shadow: 0 4px 12px rgba(200, 121, 65, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(200, 121, 65, 0.4);
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 2px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: var(--border-color);
            border-color: var(--accent-primary);
        }

        .results-screen {
            padding: 40px 30px;
            text-align: center;
            display: none;
        }

        .score-display {
            font-size: 3.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 20px 0;
        }

        .encouragement {
            font-size: 1.3rem;
            color: var(--text-primary);
            margin-bottom: 25px;
        }

        .error-message {
            background: #3a1f1f;
            color: var(--error-color);
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: center;
            border-left: 4px solid var(--error-color);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
        }

        .loading-spinner {
            width: 48px;
            height: 48px;
            border: 4px solid var(--border-color);
            border-top: 4px solid var(--accent-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Mobile-first Responsive Design */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            
            .quiz-container {
                border-radius: 16px;
            }
            
            .quiz-header {
                padding: 20px 20px 12px 20px;
            }
            
            .quiz-title {
                font-size: 1.8rem;
            }
            
            .quiz-subtitle {
                font-size: 0.9rem;
            }
            
            .progress-container {
                padding: 10px 20px;
                flex-direction: column;
                gap: 8px;
            }
            
            .progress-bar {
                width: 100%;
                margin: 5px 0;
                order: 2;
            }
            
            #question-count, #score {
                font-size: 0.9rem;
            }
            
            .question-card {
                padding: 20px;
            }
            
            .question-text {
                font-size: 1.1rem;
                padding: 15px;
                margin-bottom: 20px;
            }
            
            .option-btn {
                padding: 15px;
                font-size: 0.95rem;
            }
            
            .action-buttons {
                flex-direction: column;
                gap: 10px;
            }
            
            .btn {
                width: 100%;
                padding: 12px 20px;
            }
            
            .results-screen {
                padding: 30px 20px;
            }
            
            .score-display {
                font-size: 2.5rem;
            }
            
            .encouragement {
                font-size: 1.1rem;
            }
        }

        @media (max-width: 480px) {
            .quiz-header {
                padding: 15px 15px 10px 15px;
            }
            
            .quiz-title {
                font-size: 1.5rem;
            }
            
            .quiz-subtitle {
                font-size: 0.85rem;
            }
            
            .question-card {
                padding: 15px;
            }
            
            .question-text {
                font-size: 1rem;
                padding: 12px;
            }
            
            .options-grid {
                gap: 8px;
            }
            
            .option-btn {
                padding: 12px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="quiz-container">
        <div class="quiz-header">
            <h1 class="quiz-title">Lexicon Quest</h1>
            <p class="quiz-subtitle">Test your vocabulary mastery</p>
        </div>

        <div class="progress-container">
            <span id="question-count">Question 1/3</span>
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            <span id="score">Score: 0</span>
        </div>

        <div class="question-card" id="question-card">
            <div class="loading" id="loading-message">
                <div class="loading-spinner"></div>
                Loading questions...
            </div>
            <div class="error-message" id="error-message" style="display: none;"></div>
            
            <div id="quiz-content" style="display: none;">
                <div class="question-header">
                    <span class="difficulty-badge" id="difficulty-badge">Medium</span>
                </div>
                <div class="question-text" id="question-text">
                    Loading question...
                </div>
                <div class="options-grid" id="options-grid">
                    <!-- Options will be inserted here -->
                </div>
                <div class="explanation-box" id="explanation-box">
                    <strong>Explanation:</strong> <span id="explanation-text"></span>
                </div>
                <div class="action-buttons">
                    <button class="btn btn-secondary" onclick="skipQuestion()" id="skip-btn">Skip</button>
                    <button class="btn btn-primary" onclick="submitAnswer()" id="submit-btn" disabled>Submit Answer</button>
                    <button class="btn btn-primary" onclick="nextQuestion()" id="next-btn" style="display: none;">Next Question</button>
                </div>
            </div>
        </div>

        <div class="results-screen" id="results-screen">
            <h2>Quiz Complete! 🎉</h2>
            <div class="score-display" id="final-score">0/3</div>
            <div class="encouragement" id="encouragement-message">Keep practicing!</div>
            <button class="btn btn-primary" onclick="restartQuiz()">Try Again</button>
        </div>
    </div>

    <script>
        // Supabase configuration - use the same as your main site
        const SUPABASE_URL = 'https://jlzzxruwxyzswzgppkgq.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impsenp4cnV3eHl6c3d6Z3Bwa2dxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjE5MjEyNDksImV4cCI6MjA3NzQ5NzI0OX0.fgL70q1wRSWH4OOn3x_Gh76EZA0JIxGJsWfMTPpSBZM';
        
        let currentQuestion = 0;
        let score = 0;
        let questions = [];
        let selectedAnswer = null;

        // Initialize quiz
        async function initQuiz() {
            try {
                console.log('Fetching questions from Supabase...');
                
                // Fetch questions from Supabase
                const response = await fetch(`${SUPABASE_URL}/rest/v1/quiz_questions?select=*`, {
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                questions = await response.json();
                console.log('Questions loaded:', questions);

                if (questions.length === 0) {
                    showError('No questions found in the database. Please add questions to the quiz_questions table.');
                    return;
                }

                // Hide loading, show quiz content
                document.getElementById('loading-message').style.display = 'none';
                document.getElementById('quiz-content').style.display = 'block';
                
                displayQuestion();
            } catch (error) {
                console.error('Error fetching questions:', error);
                showError(`Failed to load questions: ${error.message}. Please check your Supabase configuration and RLS policies.`);
            }
        }

        function showError(message) {
            document.getElementById('loading-message').style.display = 'none';
            document.getElementById('error-message').style.display = 'block';
            document.getElementById('error-message').textContent = message;
        }

        function displayQuestion() {
            if (currentQuestion >= questions.length) {
                showResults();
                return;
            }

            const question = questions[currentQuestion];
            document.getElementById('question-text').textContent = question.question_text;
            document.getElementById('difficulty-badge').textContent = question.difficulty;
            document.getElementById('difficulty-badge').className = `difficulty-badge badge-${question.difficulty.toLowerCase()}`;
            
            // Update progress
            document.getElementById('question-count').textContent = `Question ${currentQuestion + 1}/${questions.length}`;
            document.getElementById('progress-fill').style.width = `${((currentQuestion) / questions.length) * 100}%`;
            document.getElementById('score').textContent = `Score: ${score}`;

            // Create options
            const optionsGrid = document.getElementById('options-grid');
            optionsGrid.innerHTML = '';
            
            // Make sure options is an array
            const optionsArray = Array.isArray(question.options) ? question.options : JSON.parse(question.options || '[]');
            
            optionsArray.forEach((option, index) => {
                const button = document.createElement('button');
                button.className = 'option-btn';
                button.textContent = option;
                button.onclick = () => selectAnswer(index);
                optionsGrid.appendChild(button);
            });

            // Reset UI state
            document.getElementById('explanation-box').classList.remove('show');
            document.getElementById('submit-btn').disabled = true;
            document.getElementById('submit-btn').style.display = 'block';
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('skip-btn').style.display = 'block';
            selectedAnswer = null;
        }

        function selectAnswer(index) {
            selectedAnswer = index;
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(btn => btn.classList.remove('selected'));
            buttons[index].classList.add('selected');
            document.getElementById('submit-btn').disabled = false;
        }

        function submitAnswer() {
            if (selectedAnswer === null) return;

            const question = questions[currentQuestion];
            const isCorrect = selectedAnswer === question.correct_answer;
            
            if (isCorrect) {
                score++;
            }

            // Show explanation
            document.getElementById('explanation-text').textContent = question.explanation;
            document.getElementById('explanation-box').classList.add('show');

            // Update UI
            document.getElementById('submit-btn').style.display = 'none';
            document.getElementById('next-btn').style.display = 'block';
            document.getElementById('skip-btn').style.display = 'none';
            document.getElementById('score').textContent = `Score: ${score}`;

            // Highlight correct answer
            const buttons = document.querySelectorAll('.option-btn');
            buttons[question.correct_answer].style.background = 'rgba(123, 200, 127, 0.1)';
            buttons[question.correct_answer].style.borderColor = '#7bc87f';
            buttons[question.correct_answer].style.color = '#7bc87f';
            
            if (!isCorrect) {
                buttons[selectedAnswer].style.background = 'rgba(217, 83, 79, 0.1)';
                buttons[selectedAnswer].style.borderColor = '#d9534f';
                buttons[selectedAnswer].style.color = '#d9534f';
            }
        }

        function nextQuestion() {
            currentQuestion++;
            displayQuestion();
        }

        function skipQuestion() {
            currentQuestion++;
            displayQuestion();
        }

        function showResults() {
            document.getElementById('question-card').style.display = 'none';
            document.getElementById('results-screen').style.display = 'block';
            document.getElementById('final-score').textContent = `${score}/${questions.length}`;
            
            // Encouragement message
            const percentage = (score / questions.length) * 100;
            let message = '';
            if (percentage >= 80) message = 'Outstanding! You\'re a vocabulary master! 🎯';
            else if (percentage >= 60) message = 'Great job! You\'re getting there! 💪';
            else message = 'Keep practicing! You\'ll improve! 📚';
            
            document.getElementById('encouragement-message').textContent = message;
        }

        function restartQuiz() {
            currentQuestion = 0;
            score = 0;
            document.getElementById('results-screen').style.display = 'none';
            document.getElementById('question-card').style.display = 'block';
            document.getElementById('loading-message').style.display = 'block';
            document.getElementById('quiz-content').style.display = 'none';
            document.getElementById('error-message').style.display = 'none';
            initQuiz();
        }

        // Start the quiz when page loads
        window.onload = initQuiz;
    </script>
</body>
</html>
