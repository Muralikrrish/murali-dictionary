<script>
    // Supabase configuration - REPLACE WITH YOUR ACTUAL CREDENTIALS
    const SUPABASE_URL = 'https://jlzzxruwxyzswzgppkgq.supabase.co';  // ← Replace this
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impsenp4cnV3eHl6c3d6Z3Bwa2dxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjE5MjEyNDksImV4cCI6MjA3NzQ5NzI0OX0.fgL70q1wRSWH4OOn3x_Gh76EZA0JIxGJsWfMTPpSBZM';  // ← Replace this
    
    let questions = [];
    let currentQuestionIndex = 0;
    let score = 0;
    let selectedAnswer = null;

    // Initialize the quiz
    async function initQuiz() {
        try {
            // Show loading state
            document.getElementById('question-text').textContent = 'Loading questions...';
            
            // Fetch questions from Supabase
            const response = await fetch(`${SUPABASE_URL}/rest/v1/quiz_questions?select=*`, {
                headers: {
                    'apikey': SUPABASE_KEY,
                    'Authorization': `Bearer ${SUPABASE_KEY}`
                }
            });
            
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            
            questions = await response.json();
            
            if (questions.length === 0) {
                throw new Error('No questions found in database');
            }
            
            // Shuffle questions for variety
            questions = shuffleArray(questions);
            
            displayQuestion();
            
        } catch (error) {
            console.error('Error loading quiz:', error);
            document.getElementById('question-text').textContent = 'Error loading questions. Please check your Supabase connection.';
            document.getElementById('options-grid').innerHTML = '<p style="color: #ef4444; text-align: center;">Check the browser console for details.</p>';
        }
    }

    function shuffleArray(array) {
        const shuffled = [...array];
        for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        return shuffled;
    }

    function displayQuestion() {
        if (currentQuestionIndex >= questions.length) {
            showResults();
            return;
        }

        const question = questions[currentQuestionIndex];
        
        // Update question text and difficulty
        document.getElementById('question-text').textContent = question.question_text;
        document.getElementById('difficulty-badge').textContent = question.difficulty;
        document.getElementById('difficulty-badge').className = `difficulty-badge badge-${question.difficulty}`;
        
        // Update progress
        document.getElementById('question-count').textContent = `Question ${currentQuestionIndex + 1}/${questions.length}`;
        document.getElementById('progress-fill').style.width = `${((currentQuestionIndex) / questions.length) * 100}%`;
        document.getElementById('score').textContent = `Score: ${score}`;

        // Create options
        const optionsGrid = document.getElementById('options-grid');
        optionsGrid.innerHTML = '';
        
        question.options.forEach((option, index) => {
            const button = document.createElement('button');
            button.className = 'option-btn';
            button.textContent = option;
            button.onclick = () => selectAnswer(index, button);
            optionsGrid.appendChild(button);
        });

        // Reset UI state
        document.getElementById('explanation-box').classList.remove('show');
        document.getElementById('submit-btn').disabled = true;
        document.getElementById('submit-btn').style.display = 'block';
        document.getElementById('next-btn').style.display = 'none';
        document.getElementById('skip-btn').style.display = 'block';
        selectedAnswer = null;
    }

    function selectAnswer(index, button) {
        // Remove selected class from all buttons
        const buttons = document.querySelectorAll('.option-btn');
        buttons.forEach(btn => {
            btn.classList.remove('selected');
            btn.classList.remove('correct');
            btn.classList.remove('incorrect');
        });
        
        // Add selected class to clicked button
        button.classList.add('selected');
        selectedAnswer = index;
        document.getElementById('submit-btn').disabled = false;
    }

    function submitAnswer() {
        if (selectedAnswer === null) return;

        const question = questions[currentQuestionIndex];
        const isCorrect = selectedAnswer === question.correct_answer;
        
        if (isCorrect) {
            score++;
        }

        // Show explanation
        document.getElementById('explanation-text').textContent = question.explanation;
        document.getElementById('explanation-box').classList.add('show');

        // Update UI
        document.getElementById('submit-btn').style.display = 'none';
        document.getElementById('next-btn').style.display = 'block';
        document.getElementById('skip-btn').style.display = 'none';
        document.getElementById('score').textContent = `Score: ${score}`;

        // Highlight correct and incorrect answers
        const buttons = document.querySelectorAll('.option-btn');
        buttons[question.correct_answer].classList.add('correct');
        
        if (!isCorrect) {
            buttons[selectedAnswer].classList.add('incorrect');
        }
    }

    function nextQuestion() {
        currentQuestionIndex++;
        displayQuestion();
    }

    function skipQuestion() {
        currentQuestionIndex++;
        displayQuestion();
    }

    function showResults() {
        document.getElementById('question-card').style.display = 'none';
        document.getElementById('results-screen').style.display = 'block';
        document.getElementById('final-score').textContent = `${score}/${questions.length}`;
        
        // Encouragement message
        const percentage = (score / questions.length) * 100;
        let message = '';
        if (percentage >= 80) message = 'Outstanding! You\'re a vocabulary master! 🎯';
        else if (percentage >= 60) message = 'Great job! You\'re getting there! 💪';
        else message = 'Keep practicing! You\'ll improve! 📚';
        
        document.getElementById('encouragement-message').textContent = message;
    }

    function restartQuiz() {
        currentQuestionIndex = 0;
        score = 0;
        document.getElementById('results-screen').style.display = 'none';
        document.getElementById('question-card').style.display = 'block';
        displayQuestion();
    }

    // Start the quiz when page loads
    window.onload = initQuiz;
</script>
