<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Quiz Test - Murali Dictionary</title>
    <style>
        /* [Keep all the same CSS styles from before] */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .quiz-container { max-width: 800px; margin: 0 auto; background: white; border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); overflow: hidden; }
        .quiz-header { background: linear-gradient(135deg, #4f46e5, #7c3aed); color: white; padding: 30px; text-align: center; }
        .quiz-header h1 { font-size: 2.5rem; margin-bottom: 10px; font-weight: 700; }
        /* [Include all the rest of your CSS here] */
    </style>
</head>
<body>
    <div class="quiz-container">
        <div class="quiz-header">
            <h1>Word Quiz Test</h1>
            <p>Testing without Supabase</p>
        </div>
        <div class="question-card">
            <div class="question-text">What's the key situation where you'd use 'ameliorate' instead of 'improve'?</div>
            <div class="options-grid">
                <button class="option-btn" onclick="checkAnswer(0)">Making good things better</button>
                <button class="option-btn" onclick="checkAnswer(1)">Improving bad situations</button>
                <button class="option-btn" onclick="checkAnswer(2)">Speeding up processes</button>
                <button class="option-btn" onclick="checkAnswer(3)">Enhancing quality</button>
            </div>
            <div class="explanation-box" id="explanation">
                <strong>Explanation:</strong> <span id="explanation-text"></span>
            </div>
        </div>
    </div>

    <script>
        function checkAnswer(selectedIndex) {
            const correctAnswer = 1; // Second option is correct
            const explanation = "Ameliorate specifically means improving something that is currently bad, unpleasant, or unsatisfactory";
            
            const buttons = document.querySelectorAll('.option-btn');
            const explanationBox = document.getElementById('explanation');
            const explanationText = document.getElementById('explanation-text');
            
            // Show explanation
            explanationText.textContent = explanation;
            explanationBox.classList.add('show');
            
            // Highlight correct answer
            buttons[correctAnswer].style.background = '#d1fae5';
            buttons[correctAnswer].style.borderColor = '#10b981';
            
            // Highlight wrong answer if selected wrong
            if (selectedIndex !== correctAnswer) {
                buttons[selectedIndex].style.background = '#fee2e2';
                buttons[selectedIndex].style.borderColor = '#ef4444';
            }
        }
    </script>
</body>
</html>
